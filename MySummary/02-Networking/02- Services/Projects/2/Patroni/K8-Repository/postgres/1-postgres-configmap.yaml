apiVersion: v1
kind: ConfigMap
metadata: { name: patroni-config, namespace: myapp }
data:
  patroni.yaml: |
    scope: pg-cluster
    namespace: myapp

    kubernetes:
      use_endpoints: true
      labels: { app: postgres }

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${HOSTNAME}.postgres-headless.myapp.svc.cluster.local:8008

    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
      initdb:
        - encoding: UTF8
        - data-checksums
      pg_hba:
        - local all all trust
        - host all all 0.0.0.0/0 md5
        - host replication replicator 0.0.0.0/0 md5
      post_bootstrap: |
        #!/bin/bash
        psql -U postgres -d appdb -c "
          CREATE USER appuser WITH PASSWORD 'localpass123' CREATEDB;
          GRANT ALL PRIVILEGES ON DATABASE appdb TO appuser;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO appuser;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO appuser;
        "

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${HOSTNAME}.postgres-headless.myapp.svc.cluster.local:5432
      data_dir: /var/lib/postgresql/data/pgdata
      authentication:
        superuser:
          username: postgres
          password: superpass
        replication:
          username: replicator
          password: replpass
      parameters:
        max_connections: 100
        shared_buffers: 128MB
        wal_level: replica
        max_wal_senders: 5
        max_replication_slots: 5
        hot_standby: 'on'
        log_statement: 'all'