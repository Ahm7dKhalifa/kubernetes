# Option 1: Connect via SERVICE names
# Patroni manages the write Endpoint - transparent failover!
apiVersion: v1
kind: Secret
metadata: { name: postgres-secret, namespace: myapp }
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: localpass123
  POSTGRES_DB: appdb
  REPLICATION_PASSWORD: replpass
  PATRONI_SUPERUSER_PASSWORD: superpass
  CONNECTION_STRING: >-
    Host=postgres-write.myapp.svc.cluster.local;Port=5432;
    Database=appdb;Username=appuser;Password=localpass123;
    Pooling=true;Min Pool Size=2;Max Pool Size=10;Include Error Detail=true;
  CONNECTION_STRING_READONLY: >-
    Host=postgres-read.myapp.svc.cluster.local;Port=5432;
    Database=appdb;Username=appuser;Password=localpass123;
    Pooling=true;Min Pool Size=2;Max Pool Size=10;Target Session Attrs=prefer-standby;Include Error Detail=true;