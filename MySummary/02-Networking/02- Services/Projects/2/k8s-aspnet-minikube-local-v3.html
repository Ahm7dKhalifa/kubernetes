CODE["sa-readme"] = [
"# Solution A: Static Primary (Simple)",
"",
"## How it works",
"- pg-0 is ALWAYS the primary (read-write)",
"- pg-1, pg-2 are ALWAYS replicas (read-only)",
"- Role is determined by pod ordinal index in the init container",
"- PostgreSQL streaming replication syncs data from primary to replicas",
"",
"## How replication works",
"1. Primary (pg-0) writes WAL (Write-Ahead Log) records",
"2. Replicas connect to primary via 'replicator' user",
"3. Replicas stream WAL records in real-time",
"4. Replicas replay WAL records to stay in sync",
"5. hot_standby=on allows read queries on replicas",
"",
"## What happens if primary (pg-0) fails?",
"- Kubernetes restarts the pod automatically",
"- The PVC data persists, so pg-0 comes back with all data",
"- During downtime: WRITES FAIL, reads from replicas still work",
"- NO automatic failover - pg-1/pg-2 do NOT become primary",
"- Typically recovers in 10-30 seconds (pod restart)",
"",
"## When to use",
"- Local development and testing",
"- Simple setups where brief write downtime is acceptable",
"- Learning Kubernetes StatefulSet patterns",
"",
"## Limitations",
"- Single point of failure for writes",
"- No automatic promotion of replicas",
"- Manual intervention needed if pg-0's PVC is corrupted"
].join("\n");

CODE["sa-secret"] = [
"apiVersion: v1",
"kind: Secret",
"metadata:",
"  name: postgres-secret",
"  namespace: myapp",
"type: Opaque",
"stringData:",
"  POSTGRES_USER: \"appuser\"",
"  POSTGRES_PASSWORD: \"localpass123\"",
"  POSTGRES_DB: \"appdb\"",
"",
"  # Write -> Primary (pg-0) via headless DNS",
"  CONNECTION_STRING: >-",
"    Host=postgres-0.postgres-headless.myapp.svc.cluster.local;",
"    Port=5432;Database=appdb;Username=appuser;Password=localpass123;",
"    Pooling=true;Minimum Pool Size=2;Maximum Pool Size=10;",
"    Include Error Detail=true;",
"",
"  # Read -> Replicas (pg-1, pg-2) load balanced",
"  CONNECTION_STRING_READONLY: >-",
"    Host=postgres-1.postgres-headless.myapp.svc.cluster.local,",
"    postgres-2.postgres-headless.myapp.svc.cluster.local;",
"    Port=5432;Database=appdb;Username=appuser;Password=localpass123;",
"    Pooling=true;Minimum Pool Size=2;Maximum Pool Size=10;",
"    Load Balance Hosts=true;Target Session Attrs=prefer-standby;",
"    Include Error Detail=true;"
].join("\n");

CODE["sa-cm"] = [
"apiVersion: v1",
"kind: ConfigMap",
"metadata:",
"  name: postgres-config",
"  namespace: myapp",
"data:",
"  postgresql.conf: |",
"    listen_addresses = '*'",
"    max_connections = 100",
"    shared_buffers = 128MB",
"    wal_level = replica",
"    max_wal_senders = 5",
"    max_replication_slots = 5",
"    hot_standby = on",
"    hot_standby_feedback = on",
"    log_statement = 'all'",
"",
"  pg_hba.conf: |",
"    local   all       all                    trust",
"    host    all       all        0.0.0.0/0   md5",
"    host    replication all      0.0.0.0/0   md5",
"",
"  init-primary.sh: |",
"    #!/bin/bash",
"    set -e",
"    # Only runs on pg-0 (primary)",
"    ORDINAL=${HOSTNAME##*-}",
"    if [ \"$ORDINAL\" != \"0\" ]; then",
"      echo \"Replica: skipping init, will stream from primary\"",
"      exit 0",
"    fi",
"    echo \"=== Initializing PRIMARY ===\"",
"    psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" <<-SQL",
"      DO $$ BEGIN",
"        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='replicator') THEN",
"          CREATE USER replicator REPLICATION ENCRYPTED PASSWORD 'replpass';",
"        END IF;",
"      END $$;",
"      CREATE TABLE IF NOT EXISTS products (",
"        id SERIAL PRIMARY KEY, name VARCHAR(200) NOT NULL,",
"        description TEXT, price DECIMAL(10,2) NOT NULL,",
"        stock INT DEFAULT 0, category VARCHAR(100),",
"        is_active BOOLEAN DEFAULT true,",
"        created_at TIMESTAMPTZ DEFAULT NOW(),",
"        updated_at TIMESTAMPTZ DEFAULT NOW());",
"      CREATE TABLE IF NOT EXISTS orders (",
"        id SERIAL PRIMARY KEY, product_id INT REFERENCES products(id),",
"        quantity INT NOT NULL CHECK(quantity>0),",
"        total_price DECIMAL(10,2) NOT NULL,",
"        status VARCHAR(50) DEFAULT 'pending',",
"        customer_name VARCHAR(200), created_at TIMESTAMPTZ DEFAULT NOW());",
"      CREATE INDEX IF NOT EXISTS idx_products_name ON products(name);",
"      CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);",
"      INSERT INTO products(name,price,stock,category) VALUES",
"        ('Kubernetes in Action',59.99,100,'Books'),",
"        ('Docker Deep Dive',39.99,50,'Books'),",
"        ('Mech Keyboard',149.99,25,'Hardware')",
"      ON CONFLICT DO NOTHING;",
"    SQL",
"    echo \"=== PRIMARY ready ===\"",
"",
"  setup-replica.sh: |",
"    #!/bin/bash",
"    set -e",
"    ORDINAL=${HOSTNAME##*-}",
"    if [ \"$ORDINAL\" = \"0\" ]; then exit 0; fi",
"    echo \"=== Setting up REPLICA from primary ===\"",
"    # Wait for primary to be ready",
"    until pg_isready -h postgres-0.postgres-headless -U appuser; do",
"      echo \"Waiting for primary...\"; sleep 2",
"    done",
"    # If data dir is empty, do base backup from primary",
"    if [ ! -s \"$PGDATA/PG_VERSION\" ]; then",
"      rm -rf $PGDATA/*",
"      pg_basebackup -h postgres-0.postgres-headless \\",
"        -U replicator -D $PGDATA -Fp -Xs -P -R",
"      echo \"primary_conninfo = 'host=postgres-0.postgres-headless user=replicator password=replpass'\" >> $PGDATA/postgresql.auto.conf",
"      touch $PGDATA/standby.signal",
"    fi",
"    echo \"=== REPLICA ready ===\""
].join("\n");

CODE["sa-headless"] = [
"# Headless Service: per-pod DNS for StatefulSet",
"apiVersion: v1",
"kind: Service",
"metadata:",
"  name: postgres-headless",
"  namespace: myapp",
"spec:",
"  clusterIP: None",
"  selector:",
"    app: postgres",
"  ports:",
"    - name: postgresql",
"      port: 5432",
"      targetPort: 5432",
"  publishNotReadyAddresses: true"
].join("\n");

CODE["sa-write-svc"] = [
"# Write Service: routes ONLY to primary (role=primary label)",
"apiVersion: v1",
"kind: Service",
"metadata:",
"  name: postgres-write",
"  namespace: myapp",
"spec:",
"  type: ClusterIP",
"  selector:",
"    app: postgres",
"    role: primary",
"  ports:",
"    - name: postgresql",
"      port: 5432",
"      targetPort: 5432"
].join("\n");

CODE["sa-read-svc"] = [
"# Read Service: routes to replicas (role=replica label)",
"# Load-balanced across pg-1 and pg-2",
"apiVersion: v1",
"kind: Service",
"metadata:",
"  name: postgres-read",
"  namespace: myapp",
"spec:",
"  type: ClusterIP",
"  selector:",
"    app: postgres",
"    role: replica",
"  ports:",
"    - name: postgresql",
"      port: 5432",
"      targetPort: 5432"
].join("\n");

CODE["sa-ss"] = [
"apiVersion: apps/v1",
"kind: StatefulSet",
"metadata:",
"  name: postgres",
"  namespace: myapp",
"spec:",
"  serviceName: postgres-headless",
"  replicas: 3",
"  selector:",
"    matchLabels:",
"      app: postgres",
"  template:",
"    metadata:",
"      labels:",
"        app: postgres",
"        # role label set by init container is NOT automatic",
"        # in static solution - we rely on ordinal-based DNS",
"    spec:",
"      terminationGracePeriodSeconds: 10",
"",
"      initContainers:",
"        # Detect role by ordinal and run setup",
"        - name: init-role",
"          image: postgres:16-alpine",
"          command: ['bash', '-c']",
"          args:",
"            - |",
"              ORDINAL=${HOSTNAME##*-}",
"              if [ \"$ORDINAL\" = \"0\" ]; then",
"                echo \"primary\" > /role/role.txt",
"                echo \"I am PRIMARY\"",
"              else",
"                echo \"replica\" > /role/role.txt",
"                echo \"I am REPLICA - will stream from pg-0\"",
"                # Run replica setup (pg_basebackup)",
"                bash /config/setup-replica.sh",
"              fi",
"          envFrom:",
"            - secretRef: { name: postgres-secret }",
"          env:",
"            - name: PGDATA",
"              value: /var/lib/postgresql/data/pgdata",
"          volumeMounts:",
"            - name: pg-data",
"              mountPath: /var/lib/postgresql/data",
"            - name: config",
"              mountPath: /config",
"            - name: role",
"              mountPath: /role",
"",
"      containers:",
"        - name: postgres",
"          image: postgres:16-alpine",
"          ports:",
"            - containerPort: 5432",
"              name: postgresql",
"          envFrom:",
"            - secretRef: { name: postgres-secret }",
"          env:",
"            - name: PGDATA",
"              value: /var/lib/postgresql/data/pgdata",
"          resources:",
"            requests: { cpu: \"100m\", memory: \"256Mi\" }",
"            limits:   { cpu: \"500m\", memory: \"512Mi\" }",
"          livenessProbe:",
"            exec:",
"              command: [pg_isready, -U, appuser, -d, appdb]",
"            initialDelaySeconds: 30",
"            periodSeconds: 10",
"          readinessProbe:",
"            exec:",
"              command: [pg_isready, -U, appuser, -d, appdb]",
"            initialDelaySeconds: 5",
"            periodSeconds: 5",
"          volumeMounts:",
"            - name: pg-data",
"              mountPath: /var/lib/postgresql/data",
"            - name: config",
"              mountPath: /config",
"            - name: init-scripts",
"              mountPath: /docker-entrypoint-initdb.d",
"            - name: role",
"              mountPath: /role",
"",
"      volumes:",
"        - name: config",
"          configMap: { name: postgres-config }",
"        - name: init-scripts",
"          configMap:",
"            name: postgres-config",
"            items:",
"              - key: init-primary.sh",
"                path: init-primary.sh",
"        - name: role",
"          emptyDir: {}",
"",
"  volumeClaimTemplates:",
"    - metadata: { name: pg-data }",
"      spec:",
"        accessModes: [\"ReadWriteOnce\"]",
"        resources:",
"          requests: { storage: 1Gi }"
].join("\n");

CODE["sa-deploy"] = [
"#!/bin/bash",
"set -e",
"echo \"=== Solution A: Static Primary ===\"",
"eval $(minikube docker-env)",
"cd ../myapp-api && docker build -t myapp-api:local . && cd -",
"",
"kubectl apply -f namespace/namespace.yaml",
"kubectl apply -f secrets/postgres-secret.yaml",

CODE["sb-readme"] = [
"# Solution B: Patroni (High Availability)",
"",
"## How it works",
"- Patroni runs as a sidecar/wrapper around PostgreSQL",
"- ANY pod can become primary (leader election via K8s API)",
"- Patroni continuously monitors health and promotes replicas",
"- Uses Kubernetes Endpoints/ConfigMaps for leader election (DCS)",
"",
"## How replication works",
"1. Patroni configures streaming replication automatically",
"2. Leader (primary) streams WAL to replicas via replication slots",
"3. Patroni manages replication slots lifecycle",
"4. Synchronous/asynchronous replication configurable",
"5. Patroni handles pg_basebackup for new/restarting replicas",
"",
"## What happens if primary fails?",
"1. Patroni detects primary is down (health check fails)",
"2. Leader lock in K8s expires (ttl: 30s default)",
"3. Patroni on remaining replicas initiates leader election",
"4. Most up-to-date replica wins election",
"5. Winner promotes itself: pg_promote() -> becomes new primary",
"6. Other replicas repoint to new primary automatically",
"7. K8s Endpoint for 'postgres-write' service updates",
"8. Total failover time: ~10-30 seconds",
"",
"## Patroni components",
"- patroni.yaml: configuration (bootstrap, pg, replication)",
"- DCS (Distributed Config Store): K8s API (Endpoints)",
"- REST API on port 8008: health, switchover, failover",
"- ServiceAccount + RBAC: for Patroni to update K8s Endpoints",
"",
"## When to use",
"- Production environments",
"- When zero/minimal write downtime is critical",
"- Multi-node clusters",
"- Automated operations (no manual intervention)"
].join("\n");

CODE["sb-patroni-cm"] = [
"apiVersion: v1",
"kind: ConfigMap",
"metadata:",
"  name: patroni-config",
"  namespace: myapp",
"data:",
"  patroni.yaml: |",
"    scope: postgres-cluster",
"    namespace: myapp",
"    name: ${HOSTNAME}",
"",
"    kubernetes:",
"      use_endpoints: true",
"      labels:",
"        app: postgres",
"",
"    restapi:",
"      listen: 0.0.0.0:8008",
"      connect_address: ${HOSTNAME}.postgres-headless:8008",
"",
"    bootstrap:",
"      dcs:",
"        ttl: 30",
"        loop_wait: 10",
"        retry_timeout: 10",
"        maximum_lag_on_failover: 1048576  # 1MB",
"      initdb:",
"        - encoding: UTF8",
"        - data-checksums",
"      pg_hba:",
"        - local all all trust",
"        - host all all 0.0.0.0/0 md5",
"        - host replication all 0.0.0.0/0 md5",
"      users:",
"        appuser:",
"          password: localpass123",
"          options:",
"            - createdb",
"        replicator:",
"          password: replpass",
"          options:",
"            - replication",
"",
"    postgresql:",
"      listen: 0.0.0.0:5432",
"      connect_address: ${HOSTNAME}.postgres-headless:5432",
"      data_dir: /var/lib/postgresql/data/pgdata",
"      authentication:",
"        superuser:",
"          username: postgres",
"          password: superpass",
"        replication:",
"          username: replicator",
"          password: replpass",
"      parameters:",
"        max_connections: 100",
"        shared_buffers: 128MB",
"        wal_level: replica",
"        max_wal_senders: 5",
"        max_replication_slots: 5",
"        hot_standby: 'on'",
"        log_statement: 'all'"
].join("\n");

CODE["app-writedb"] = ["using Microsoft.EntityFrameworkCore;","using MyApp.Api.Models;","","namespace MyApp.Api.Data;","","public class AppDbContext : DbContext","{","    public AppDbContext(DbContextOptions<AppDbContext> o) : base(o) {}","    public DbSet<Product> Products => Set<Product>();","    public DbSet<Order> Orders => Set<Order>();","    protected override void OnModelCreating(ModelBuilder mb)","    {","        mb.Entity<Product>(e => { e.HasIndex(p=>p.Name); e.HasIndex(p=>p.Category);","            e.Property(p=>p.CreatedAt).HasDefaultValueSql(\"NOW()\");","            e.Property(p=>p.UpdatedAt).HasDefaultValueSql(\"NOW()\"); });","        mb.Entity<Order>(e => { e.HasIndex(o=>o.Status);","            e.HasOne(o=>o.Product).WithMany(p=>p.Orders)","             .HasForeignKey(o=>o.ProductId).OnDelete(DeleteBehavior.Restrict); });","    }","    public override Task<int> SaveChangesAsync(CancellationToken ct=default)","    {","        foreach(var e in ChangeTracker.Entries<Product>()","            .Where(e=>e.State==EntityState.Modified)) e.Entity.UpdatedAt=DateTime.UtcNow;","        return base.SaveChangesAsync(ct);","    }","}"].join("\n");

CODE["app-svc"] = ["using Microsoft.EntityFrameworkCore;","using MyApp.Api.Data; using MyApp.Api.Models;","namespace MyApp.Api.Services;","public class ProductService(AppDbContext w,ReadOnlyDbContext r,ILogger<ProductService> log):IProductService","{","    public async Task<List<Product>> GetAllAsync(string? cat){","        var q=r.Products.Where(p=>p.IsActive);","        if(!string.IsNullOrEmpty(cat)) q=q.Where(p=>p.Category==cat);","        return await q.OrderByDescending(p=>p.CreatedAt).ToListAsync(); }","    public async Task<Product?> GetByIdAsync(int id)=>","        await r.Products.Include(p=>p.Orders.OrderByDescending(o=>o.CreatedAt).Take(10))","            .FirstOrDefaultAsync(p=>p.Id==id);","    public async Task<List<Product>> SearchAsync(string q)=>","        await r.Products.Where(p=>p.IsActive&&EF.Functions.ILike(p.Name,\"%\"+q+\"%\")).Take(50).ToListAsync();","    public async Task<List<Order>> GetOrdersAsync(int pid)=>","        await r.Orders.Where(o=>o.ProductId==pid).OrderByDescending(o=>o.CreatedAt).Take(100).ToListAsync();","    public async Task<DashboardStats> GetStatsAsync(){","        return new(await r.Products.CountAsync(p=>p.IsActive),await r.Orders.CountAsync(),","            await r.Orders.Where(o=>o.Status==\"confirmed\").SumAsync(o=>o.TotalPrice)); }","    public async Task<Product> CreateAsync(Product p){","        log.LogInformation(\"WRITE: Create\"); w.Products.Add(p); await w.SaveChangesAsync(); return p; }","    public async Task<Product?> UpdateAsync(int id,Product u){","        var p=await w.Products.FindAsync(id); if(p is null) return null;","        p.Name=u.Name;p.Price=u.Price;p.Stock=u.Stock;p.Category=u.Category;","        await w.SaveChangesAsync(); return p; }","    public async Task<bool> DeleteAsync(int id){","        var p=await w.Products.FindAsync(id); if(p is null) return false;","        p.IsActive=false; await w.SaveChangesAsync(); return true; }","    public async Task<Order> PlaceOrderAsync(int pid,int qty,string? cust){","        await using var tx=await w.Database.BeginTransactionAsync();","        try{","            var p=await w.Products.FindAsync(pid)??throw new KeyNotFoundException(\"Not found\");","            if(p.Stock<qty) throw new InvalidOperationException(\"Insufficient stock\");","            p.Stock-=qty;","            var o=new Order{ProductId=pid,Quantity=qty,TotalPrice=p.Price*qty,CustomerName=cust,Status=\"confirmed\"};","            w.Orders.Add(o); await w.SaveChangesAsync(); await tx.CommitAsync();","            log.LogInformation(\"WRITE: Order {Id}\",o.Id); return o;","        }catch{ await tx.RollbackAsync(); throw; } }","}"].join("\n");

CODE["app-ctrl"] = ["using Microsoft.AspNetCore.Mvc;","using MyApp.Api.Models; using MyApp.Api.Services;","namespace MyApp.Api.Controllers;","[ApiController][Route(\"api/[controller]\")]","public class ProductsController(IProductService svc):ControllerBase","{","    [HttpGet] public async Task<ActionResult<List<Product>>>","        GetAll([FromQuery]string? category)=>Ok(await svc.GetAllAsync(category));","    [HttpGet(\"{id:int}\")] public async Task<ActionResult<Product>>","        GetById(int id){ var p=await svc.GetByIdAsync(id); return p is null?NotFound():Ok(p); }","    [HttpGet(\"search\")] public async Task<ActionResult<List<Product>>>","        Search([FromQuery]string q)=>Ok(await svc.SearchAsync(q));","    [HttpGet(\"{id:int}/orders\")] public async Task<ActionResult<List<Order>>>","        GetOrders(int id)=>Ok(await svc.GetOrdersAsync(id));","    [HttpGet(\"stats\")] public async Task<ActionResult<DashboardStats>>","        Stats()=>Ok(await svc.GetStatsAsync());","    [HttpPost] public async Task<ActionResult<Product>> Create(Product p)","        { var c=await svc.CreateAsync(p); return CreatedAtAction(nameof(GetById),new{id=c.Id},c); }","    [HttpPut(\"{id:int}\")] public async Task<ActionResult<Product>>","        Update(int id,Product p){ var u=await svc.UpdateAsync(id,p); return u is null?NotFound():Ok(u); }","    [HttpDelete(\"{id:int}\")] public async Task<IActionResult>","        Delete(int id)=>await svc.DeleteAsync(id)?NoContent():NotFound();","    [HttpPost(\"{id:int}/orders\")] public async Task<ActionResult<Order>>","        PlaceOrder(int id,[FromBody]OrderReq req){","        try{ var o=await svc.PlaceOrderAsync(id,req.Quantity,req.CustomerName);","            return CreatedAtAction(nameof(GetOrders),new{id},o); }","        catch(KeyNotFoundException){return NotFound();}","        catch(InvalidOperationException ex){return BadRequest(new{error=ex.Message});} }","}","public record OrderReq(int Quantity,string? CustomerName);"].join("\n");

"sa-readme":{t:"Solution A: Static Primary",d:"pg-0 is always primary. Simple, no external tools. Manual recovery on failure.",l:"md",f:"README.md",notes:[{c:"cyan",h:"<b>Replication:</b> pg-0 streams WAL to pg-1/pg-2 via PostgreSQL streaming replication. <b>Failover:</b> If pg-0 dies, K8s restarts it. Writes fail during restart (~10-30s). No auto-promotion."},{c:"red",h:"<b>Limitation:</b> If pg-0 dies, writes are DOWN until K8s restarts it. Replicas do NOT auto-promote. This is acceptable for local dev."}]},
