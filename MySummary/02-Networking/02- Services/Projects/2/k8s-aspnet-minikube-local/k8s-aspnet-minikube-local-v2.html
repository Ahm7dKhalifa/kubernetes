<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASP.NET Core + PostgreSQL on Minikube — Local Dev</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#06070d;--bg-surface:#0a0b14;--bg-code:#080a12;--bg-hover:rgba(255,255,255,0.025);--border:rgba(255,255,255,0.06);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-dim:#475569;--text-muted:#334155;--accent-indigo:#6366f1;--accent-cyan:#0ea5e9;--accent-emerald:#10b981;--accent-amber:#f59e0b;--accent-csharp:#68217a;--accent-minikube:#f97316}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-deep);color:var(--text-primary);font-family:'JetBrains Mono','SF Mono','Fira Code',monospace;min-height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
.header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,rgba(249,115,22,0.04) 0%,transparent 100%)}
.header-left{flex:1}.header-tag{font-size:9px;letter-spacing:3px;color:var(--accent-minikube);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.header h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--accent-minikube),var(--accent-cyan),var(--accent-emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-badges{display:flex;gap:8px}.badge{font-size:10px;padding:4px 10px;border-radius:6px;font-weight:600;border:1px solid}
.badge-k8s{background:rgba(249,115,22,0.1);color:var(--accent-minikube);border-color:rgba(249,115,22,0.25)}
.badge-app{background:rgba(104,33,122,0.15);color:#b668d4;border-color:rgba(104,33,122,0.3)}
.layout{display:flex;height:calc(100vh - 58px)}
.sidebar{width:310px;min-width:310px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface)}
.repo-tabs{display:flex;border-bottom:1px solid var(--border)}
.repo-tab{flex:1;padding:10px 12px;font-size:11px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;justify-content:center;border-bottom:2px solid transparent}
.repo-tab.k8s{background:rgba(249,115,22,0.06);color:var(--text-dim)}.repo-tab.app{background:rgba(104,33,122,0.06);color:var(--text-dim)}
.repo-tab.k8s.active{background:rgba(249,115,22,0.15);color:var(--accent-minikube);border-bottom-color:var(--accent-minikube)}
.repo-tab.app.active{background:rgba(104,33,122,0.15);color:#b668d4;border-bottom-color:#b668d4}
.tree-container{flex:1;overflow-y:auto;padding:8px 0}
.tree-item{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;transition:background .1s;font-size:12px;color:var(--text-secondary);user-select:none;border-left:2px solid transparent}
.tree-item:hover{background:var(--bg-hover)}.tree-item.active{background:rgba(99,102,241,0.1);color:#e0e7ff;border-left-color:var(--accent-indigo)}
.tree-item.folder{color:var(--text-primary);font-weight:600}
.tree-indent{display:inline-block;width:16px;flex-shrink:0}.tree-icon{font-size:13px;flex-shrink:0;width:18px;text-align:center}
.tree-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-chevron{font-size:10px;color:var(--text-dim);transition:transform .15s;width:12px;text-align:center;flex-shrink:0}
.tree-chevron.open{transform:rotate(90deg)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.file-tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--bg-surface);overflow-x:auto;min-height:34px;scrollbar-width:none}
.file-tab-bar::-webkit-scrollbar{display:none}
.file-tab{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:11px;font-family:inherit;color:var(--text-dim);border:none;border-right:1px solid var(--border);cursor:pointer;background:transparent;white-space:nowrap;transition:all .1s}
.file-tab:hover{background:rgba(255,255,255,0.02);color:var(--text-secondary)}
.file-tab.active{background:var(--bg-deep);color:var(--text-primary);border-bottom:1px solid var(--bg-deep);margin-bottom:-1px}
.file-tab .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.content-area{flex:1;overflow-y:auto}
.file-content{padding:20px 24px;max-width:860px}
.file-path{font-size:11px;color:var(--text-dim);margin-bottom:12px;padding:6px 10px;background:rgba(255,255,255,0.02);border-radius:6px;border:1px solid var(--border);display:inline-block}
.file-path b{color:var(--accent-minikube)}
.sec-header{margin-bottom:16px}.sec-title{font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:6px}
.sec-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.7}
.code-block{border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:rgba(255,255,255,0.025);border-bottom:1px solid var(--border)}
.code-head-left{display:flex;align-items:center;gap:8px}
.code-dot{width:7px;height:7px;border-radius:50%}.code-fname{font-size:11.5px;color:#c4b5fd;font-weight:600}
.code-lang{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}
.copy-btn{font-size:10px;padding:3px 9px;border-radius:4px;background:rgba(255,255,255,0.04);color:var(--text-secondary);border:1px solid var(--border);cursor:pointer;font-family:inherit;transition:all .12s}
.copy-btn:hover{background:rgba(255,255,255,0.08)}.copy-btn.copied{background:rgba(16,185,129,0.12);color:var(--accent-emerald);border-color:rgba(16,185,129,0.25)}
.code-body{padding:12px 14px;overflow-x:auto;font-size:11.5px;line-height:1.7;color:#cbd5e1;white-space:pre;tab-size:2;background:var(--bg-code)}
.info-note{padding:12px 16px;border-radius:8px;font-size:12px;line-height:1.75;margin-bottom:14px}
.info-note.purple{background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.15);color:#c4b5fd}
.info-note.cyan{background:rgba(14,165,233,0.07);border:1px solid rgba(14,165,233,0.15);color:#7dd3fc}
.info-note.emerald{background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.15);color:#6ee7b7}
.info-note.orange{background:rgba(249,115,22,0.07);border:1px solid rgba(249,115,22,0.15);color:#fdba74}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:12px;padding:40px}
.empty-state .es-icon{font-size:48px;opacity:0.3}.empty-state p{font-size:13px;text-align:center;line-height:1.6}
@media(max-width:700px){.layout{flex-direction:column}.sidebar{width:100%;min-width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-tag">Local Development with Minikube</div>
    <h1>ASP.NET Core + PostgreSQL on Minikube</h1>
  </div>
  <div class="header-badges">
    <span class="badge badge-k8s">&#9784;&#65039; Minikube</span>
    <span class="badge badge-app">&#128309; .NET App</span>
  </div>
</div>
<div class="layout">
  <div class="sidebar">
    <div class="repo-tabs">
      <button class="repo-tab k8s active" onclick="switchRepo('k8s')">&#9784;&#65039; K8s Local</button>
      <button class="repo-tab app" onclick="switchRepo('app')">&#128309; Application</button>
    </div>
    <div class="tree-container" id="tree-container"></div>
  </div>
  <div class="main">
    <div class="file-tab-bar" id="file-tab-bar"></div>
    <div class="content-area" id="content-area">
      <div class="empty-state"><div class="es-icon">&#128194;</div><p>Select a file from the tree to view its contents.<br>Switch between K8s and Application repos using the tabs.</p></div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";

var LANG_COLORS = {yaml:"#f59e0b",csharp:"#68217a",bash:"#10b981",json:"#0ea5e9",xml:"#ef4444",dockerfile:"#2496ed",text:"#64748b",md:"#94a3b8"};

var CODE = {};

// ══════════════════════════════════════════
//  K8S LOCAL REPO
// ══════════════════════════════════════════

CODE["k8s-setup"] = [
"#!/bin/bash",
"# Prerequisites: install minikube, kubectl, docker",
"",
"# Start minikube with enough resources for 3 PG pods + API",
"minikube start \\",
"  --cpus=4 \\",
"  --memory=6144 \\",
"  --disk-size=30g \\",
"  --driver=docker",
"",
"# Enable required addons",
"minikube addons enable ingress",
"minikube addons enable metrics-server",
"minikube addons enable storage-provisioner",
"",
"# Point Docker CLI to Minikube's Docker daemon",
"# (so we can build images directly inside Minikube)",
"eval $(minikube docker-env)",
"",
"# Verify",
"kubectl cluster-info",
"minikube status",
"",
"echo \"Minikube is ready!\"",
"echo \"Resources: 4 CPUs, 6GB RAM, 30GB disk\"",
"echo \"PostgreSQL will run 3 pods (primary + 2 replicas)\""
].join("\n");

CODE["k8s-ns"] = [
"apiVersion: v1",
"kind: Namespace",
"metadata:",
"  name: myapp",
"  labels:",
"    app: myapp-project",
"    environment: local"
].join("\n");

CODE["k8s-secret"] = [
"apiVersion: v1",
"kind: Secret",
"metadata:",
"  name: postgres-secret",
"  namespace: myapp",
"type: Opaque",
"stringData:",
"  POSTGRES_USER: \"appuser\"",
"  POSTGRES_PASSWORD: \"localpass123\"",
"  POSTGRES_DB: \"appdb\"",
"",
"  # Write -> Primary (postgres-0) via headless DNS",
"  CONNECTION_STRING: >-",
"    Host=postgres-0.postgres-headless.myapp.svc.cluster.local;",
"    Port=5432;",
"    Database=appdb;",
"    Username=appuser;",
"    Password=localpass123;",
"    Pooling=true;",
"    Minimum Pool Size=2;",
"    Maximum Pool Size=10;",
"    Include Error Detail=true;",
"",
"  # Read -> Replicas (postgres-1, postgres-2) load balanced",
"  CONNECTION_STRING_READONLY: >-",
"    Host=postgres-1.postgres-headless.myapp.svc.cluster.local,",
"    postgres-2.postgres-headless.myapp.svc.cluster.local;",
"    Port=5432;",
"    Database=appdb;",
"    Username=appuser;",
"    Password=localpass123;",
"    Pooling=true;",
"    Minimum Pool Size=2;",
"    Maximum Pool Size=10;",
"    Load Balance Hosts=true;",
"    Target Session Attrs=prefer-standby;",
"    Include Error Detail=true;"
].join("\n");

CODE["k8s-cm"] = [
"apiVersion: v1",
"kind: ConfigMap",
"metadata:",
"  name: postgres-config",
"  namespace: myapp",
"data:",
"  # PostgreSQL config with replication + verbose logging",
"  postgresql.conf: |",
"    listen_addresses = '*'",
"    max_connections = 100",
"    shared_buffers = 128MB",
"    wal_level = replica",
"    max_wal_senders = 5",
"    max_replication_slots = 5",
"    hot_standby = on",
"    hot_standby_feedback = on",
"    log_statement = 'all'",
"    log_min_duration_statement = 0",
"",
"  pg_hba.conf: |",
"    # TYPE  DATABASE  USER       ADDRESS     METHOD",
"    local   all       all                    trust",
"    host    all       all        0.0.0.0/0   md5",
"    host    replication all      0.0.0.0/0   md5",
"",
"  init.sql: |",
"    -- Application schema",
"    CREATE TABLE IF NOT EXISTS products (",
"      id          SERIAL PRIMARY KEY,",
"      name        VARCHAR(200) NOT NULL,",
"      description TEXT,",
"      price       DECIMAL(10,2) NOT NULL,",
"      stock       INT DEFAULT 0,",
"      category    VARCHAR(100),",
"      is_active   BOOLEAN DEFAULT true,",
"      created_at  TIMESTAMPTZ DEFAULT NOW(),",
"      updated_at  TIMESTAMPTZ DEFAULT NOW()",
"    );",
"    CREATE TABLE IF NOT EXISTS orders (",
"      id            SERIAL PRIMARY KEY,",
"      product_id    INT REFERENCES products(id),",
"      quantity      INT NOT NULL CHECK (quantity > 0),",
"      total_price   DECIMAL(10,2) NOT NULL,",
"      status        VARCHAR(50) DEFAULT 'pending',",
"      customer_name VARCHAR(200),",
"      created_at    TIMESTAMPTZ DEFAULT NOW()",
"    );",
"    CREATE INDEX IF NOT EXISTS idx_products_name ON products(name);",
"    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);",
"",
"    -- Replication user",
"    DO $$ BEGIN",
"      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') THEN",
"        CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD 'replpass123';",
"      END IF;",
"    END $$;",
"",
"    -- Seed data for local testing",
"    INSERT INTO products (name, description, price, stock, category)",
"    VALUES",
"      ('Kubernetes in Action', 'K8s guide', 59.99, 100, 'Books'),",
"      ('Docker Deep Dive', 'Container basics', 39.99, 50, 'Books'),",
"      ('Mechanical Keyboard', 'Cherry MX Blue', 149.99, 25, 'Hardware')",
"    ON CONFLICT DO NOTHING;"
].join("\n");

CODE["k8s-pv"] = [
"# Minikube uses the default 'standard' StorageClass (hostPath).",
"# No custom StorageClass or manual PVC needed!",
"#",
"# The StatefulSet's volumeClaimTemplates auto-creates a PVC",
"# for each of the 3 pods:",
"#",
"#   postgres-0 -> pg-data-postgres-0 (1Gi) [Primary R/W]",
"#   postgres-1 -> pg-data-postgres-1 (1Gi) [Replica RO]",
"#   postgres-2 -> pg-data-postgres-2 (1Gi) [Replica RO]",
"#",
"# Data persists across pod restarts (stored on Minikube VM).",
"# Data is lost only when you run: minikube delete",
"#",
"# To verify the auto-created PVCs:",
"#   kubectl -n myapp get pvc",
"#   NAME                   STATUS  CAPACITY  STORAGECLASS",
"#   pg-data-postgres-0     Bound   1Gi       standard",
"#   pg-data-postgres-1     Bound   1Gi       standard",
"#   pg-data-postgres-2     Bound   1Gi       standard",
"#",
"# To wipe and re-seed the database:",
"#   kubectl -n myapp delete statefulset postgres",
"#   kubectl -n myapp delete pvc pg-data-postgres-0 pg-data-postgres-1 pg-data-postgres-2",
"#   kubectl apply -f postgres-statefulset.yaml"
].join("\n");

CODE["k8s-pg-svc"] = [
"# Headless Service: clusterIP: None",
"# Gives each StatefulSet pod a stable DNS name:",
"#   postgres-0.postgres-headless.myapp.svc.cluster.local",
"#",
"# Same pattern as production - just 1 replica locally",
"apiVersion: v1",
"kind: Service",
"metadata:",
"  name: postgres-headless",
"  namespace: myapp",
"  labels:",
"    app: postgres",
"spec:",
"  clusterIP: None",
"  selector:",
"    app: postgres",
"  ports:",
"    - name: postgresql",
"      port: 5432",
"      targetPort: 5432",
"  publishNotReadyAddresses: true"
].join("\n");

CODE["k8s-pg-ss"] = [
"# StatefulSet: 3 replicas, same as production",
"# postgres-0 = Primary (R/W), postgres-1/2 = Replicas (RO)",
"# Init container detects role by ordinal index",
"apiVersion: apps/v1",
"kind: StatefulSet",
"metadata:",
"  name: postgres",
"  namespace: myapp",
"spec:",
"  serviceName: postgres-headless",
"  replicas: 3",
"  selector:",
"    matchLabels:",
"      app: postgres",
"  template:",
"    metadata:",
"      labels:",
"        app: postgres",
"    spec:",
"      terminationGracePeriodSeconds: 10",
"",
"      initContainers:",
"        - name: init-role",
"          image: busybox:1.36",
"          command: ['sh', '-c']",
"          args:",
"            - |",
"              ORDINAL=${HOSTNAME##*-}",
"              if [ \"$ORDINAL\" = \"0\" ]; then",
"                echo \"primary\" > /role/role.txt",
"                echo \"Role: PRIMARY\"",
"              else",
"                echo \"replica\" > /role/role.txt",
"                echo \"Role: REPLICA\"",
"              fi",
"          volumeMounts:",
"            - name: role",
"              mountPath: /role",
"",
"      containers:",
"        - name: postgres",
"          image: postgres:16-alpine",
"          ports:",
"            - containerPort: 5432",
"              name: postgresql",
"          envFrom:",
"            - secretRef:",
"                name: postgres-secret",
"          env:",
"            - name: PGDATA",
"              value: /var/lib/postgresql/data/pgdata",
"          resources:",
"            requests: { cpu: \"100m\", memory: \"256Mi\" }",
"            limits:   { cpu: \"500m\", memory: \"512Mi\" }",
"          livenessProbe:",
"            exec:",
"              command: [pg_isready, -U, appuser, -d, appdb]",
"            initialDelaySeconds: 30",
"            periodSeconds: 10",
"            failureThreshold: 6",
"          readinessProbe:",
"            exec:",
"              command: [pg_isready, -U, appuser, -d, appdb]",
"            initialDelaySeconds: 5",
"            periodSeconds: 5",
"            failureThreshold: 3",
"          volumeMounts:",
"            - name: pg-data",
"              mountPath: /var/lib/postgresql/data",
"            - name: config",
"              mountPath: /config",
"            - name: init-scripts",
"              mountPath: /docker-entrypoint-initdb.d",
"            - name: role",
"              mountPath: /role",
"",
"      volumes:",
"        - name: config",
"          configMap:",
"            name: postgres-config",
"            items:",
"              - key: postgresql.conf",
"                path: postgresql.conf",
"              - key: pg_hba.conf",
"                path: pg_hba.conf",
"        - name: init-scripts",
"          configMap:",
"            name: postgres-config",
"            items:",
"              - key: init.sql",
"                path: init.sql",
"        - name: role",
"          emptyDir: {}",
"",
"  # PVC auto-created per pod using Minikube 'standard' StorageClass",
"  # postgres-0 -> pg-data-postgres-0 (1Gi)",
"  # postgres-1 -> pg-data-postgres-1 (1Gi)",
"  # postgres-2 -> pg-data-postgres-2 (1Gi)",
"  volumeClaimTemplates:",
"    - metadata:",
"        name: pg-data",
"      spec:",
"        accessModes: [\"ReadWriteOnce\"]",
"        resources:",
"          requests:",
"            storage: 1Gi"
].join("\n");

CODE["k8s-app-dep"] = [
"apiVersion: apps/v1",
"kind: Deployment",
"metadata:",
"  name: myapp-api",
"  namespace: myapp",
"spec:",
"  replicas: 1              # Single replica for local dev",
"  selector:",
"    matchLabels:",
"      app: myapp-api",
"  template:",
"    metadata:",
"      labels:",
"        app: myapp-api",
"    spec:",
"      containers:",
"        - name: api",
"          image: myapp-api:local    # Built locally in Minikube",
"          imagePullPolicy: Never    # Use local image, don't pull",
"          ports:",
"            - containerPort: 8080",
"          env:",
"            - name: CONNECTION_STRING",
"              valueFrom:",
"                secretKeyRef:",
"                  name: postgres-secret",
"                  key: CONNECTION_STRING",
"            - name: CONNECTION_STRING_READONLY",
"              valueFrom:",
"                secretKeyRef:",
"                  name: postgres-secret",
"                  key: CONNECTION_STRING_READONLY",
"            - name: ASPNETCORE_ENVIRONMENT",
"              value: \"Development\"",
"          resources:",
"            requests: { cpu: \"50m\", memory: \"128Mi\" }",
"            limits:   { cpu: \"300m\", memory: \"256Mi\" }",
"          readinessProbe:",
"            httpGet: { path: /healthz, port: 8080 }",
"            initialDelaySeconds: 10",
"            periodSeconds: 5"
].join("\n");

CODE["k8s-app-svc"] = [
"apiVersion: v1",
"kind: Service",
"metadata:",
"  name: myapp-api-svc",
"  namespace: myapp",
"spec:",
"  type: NodePort            # NodePort for easy local access",
"  selector:",
"    app: myapp-api",
"  ports:",
"    - port: 80",
"      targetPort: 8080",
"      nodePort: 30080       # Access via minikube ip:30080"
].join("\n");

CODE["k8s-deploy-sh"] = [
"#!/bin/bash",
"set -e",
"",
"echo \"=== Local K8s Deployment (Minikube) ===\"",
"",
"# 1. Point Docker to Minikube",
"echo \"-> Setting Docker env to Minikube...\"",
"eval $(minikube docker-env)",
"",
"# 2. Build the .NET app image locally",
"echo \"-> Building API image inside Minikube...\"",
"cd ../myapp-api    # adjust path to your app repo",
"docker build -t myapp-api:local .",
"cd -",
"",
"# 3. Apply K8s resources",
"echo \"-> Creating namespace & secrets...\"",
"kubectl apply -f namespace.yaml",
"kubectl apply -f postgres-secret.yaml",
"kubectl apply -f postgres-configmap.yaml",
"",
"echo \"-> Creating storage info...\"",
"# No manual PVC needed - StatefulSet volumeClaimTemplates handles it",
"",
"echo \"-> Deploying PostgreSQL (StatefulSet)...\"",
"kubectl apply -f postgres-headless-service.yaml",
"kubectl apply -f postgres-statefulset.yaml",
"echo \"   Waiting for StatefulSet...\"",
"kubectl -n myapp rollout status statefulset/postgres --timeout=180s",
"",
"echo \"-> Deploying ASP.NET Core API...\"",
"kubectl apply -f app-deployment.yaml",
"kubectl apply -f app-service.yaml",
"echo \"   Waiting for API...\"",
"kubectl -n myapp wait --for=condition=ready pod -l app=myapp-api --timeout=60s",
"",
"echo \"\"",
"echo \"=== Deployed! ===\"",
"echo \"\"",
"# Get access URL",
"API_URL=$(minikube service myapp-api-svc -n myapp --url)",
"echo \"API URL:     $API_URL\"",
"echo \"Swagger:     $API_URL/swagger\"",
"echo \"Health:      $API_URL/healthz\"",
"echo \"\"",
"kubectl -n myapp get all"
].join("\n");

CODE["k8s-teardown-sh"] = [
"#!/bin/bash",

CODE["k8s-handy"] = [
"#!/bin/bash",
"# Handy commands for local development",
"",
"# --- Access ---",
"# Open API in browser",
"minikube service myapp-api-svc -n myapp",
"",
"# Port-forward (alternative to NodePort)",
"kubectl -n myapp port-forward svc/myapp-api-svc 8080:80",
"",
"# --- Logs ---",
"# Watch API logs live",
"kubectl -n myapp logs -f -l app=myapp-api",
"",
"# Watch PostgreSQL logs (primary)",
"kubectl -n myapp logs -f postgres-0",
"",
"# Watch PostgreSQL logs (replica 1)",
"kubectl -n myapp logs -f postgres-1",
"",
"# --- Debug ---",
"# Shell into API pod",
"kubectl -n myapp exec -it deploy/myapp-api -- sh",
"",
"# Shell into PostgreSQL primary",
"kubectl -n myapp exec -it postgres-0 -- psql -U appuser -d appdb",
"",
"# Shell into PostgreSQL replica",
"kubectl -n myapp exec -it postgres-1 -- psql -U appuser -d appdb",
"",
"# Check all resources",
"kubectl -n myapp get all",
"",
"# Check all 3 PG pods",
"kubectl -n myapp get pods -l app=postgres -o wide",
"# postgres-0  Running  <- Primary (R/W)",
"# postgres-1  Running  <- Replica (RO)",
"# postgres-2  Running  <- Replica (RO)",
"",
"# Check PVCs",
"kubectl -n myapp get pvc",
"",
"# Describe a failing pod",
"kubectl -n myapp describe pod postgres-0",
"",
"# --- Rebuild & Redeploy ---",
"# After code changes:",
"eval $(minikube docker-env)",
"docker build -t myapp-api:local .",
"kubectl -n myapp rollout restart deployment/myapp-api",
"kubectl -n myapp rollout status deployment/myapp-api",
"",
"# --- Reset DB (wipe all 3 pods and re-seed) ---",
"kubectl -n myapp delete statefulset postgres",
"kubectl -n myapp delete pvc pg-data-postgres-0 pg-data-postgres-1 pg-data-postgres-2",
"kubectl apply -f postgres-statefulset.yaml",
"kubectl -n myapp rollout status statefulset/postgres",
"",
"# --- Minikube Dashboard ---",
"minikube dashboard"
].join("\n");

"                      Version=\"8.0.4\" />",
"    <PackageReference Include=\"Microsoft.EntityFrameworkCore.Design\"",
"                      Version=\"8.0.8\" />",

CODE["app-program"] = [
"using Microsoft.EntityFrameworkCore;",
"using MyApp.Api.Data;",
"using MyApp.Api.Services;",
"",
"var builder = WebApplication.CreateBuilder(args);",
"",
"// --- Connection Strings ---",
"// In Minikube: injected from K8s Secret as env vars",
"// Locally (dotnet run): from appsettings.Development.json",
"var writeConn = Environment.GetEnvironmentVariable(\"CONNECTION_STRING\")",
"    ?? builder.Configuration.GetConnectionString(\"WriteDb\")",
"    ?? throw new InvalidOperationException(\"WriteDb required\");",
"",
"var readConn = Environment.GetEnvironmentVariable(\"CONNECTION_STRING_READONLY\")",
"    ?? builder.Configuration.GetConnectionString(\"ReadDb\")",
"    ?? writeConn;  // fallback: use write conn for reads too",
"",
"// --- WRITE DbContext ---",
"builder.Services.AddDbContext<AppDbContext>(opt =>",
"    opt.UseNpgsql(writeConn, n => n.EnableRetryOnFailure(3))",
"       .EnableDetailedErrors()",
"       .EnableSensitiveDataLogging());",
"",
"// --- READ DbContext ---",
"builder.Services.AddDbContext<ReadOnlyDbContext>(opt =>",
"    opt.UseNpgsql(readConn, n => n.EnableRetryOnFailure(3))",
"       .UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking)",
"       .EnableDetailedErrors());",
"",
"builder.Services.AddScoped<IProductService, ProductService>();",
"builder.Services.AddControllers();",
"builder.Services.AddSwaggerGen();",
"builder.Services.AddHealthChecks()",
"    .AddNpgSql(writeConn, name: \"postgres\");",
"",
"var app = builder.Build();",
"",
"// Auto-migrate on startup",
"using (var scope = app.Services.CreateScope())",
"{",
"    var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();",
"    await db.Database.MigrateAsync();",
"}",
"",
"app.UseSwagger();",
"app.UseSwaggerUI();",
"app.MapControllers();",
"app.MapHealthChecks(\"/healthz\");",
"app.MapGet(\"/\", () => Results.Redirect(\"/swagger\"));",
"app.Run();"
].join("\n");

CODE["app-writedb"] = [
"using Microsoft.EntityFrameworkCore;",
"using MyApp.Api.Models;",
"",
"namespace MyApp.Api.Data;",
"",
"/// <summary>",
"/// WRITE context.",
"/// Local dev: same PostgreSQL instance as reads.",
"/// Production: routed to primary (pg-0).",
"/// </summary>",
"public class AppDbContext : DbContext",
"{",
"    public AppDbContext(DbContextOptions<AppDbContext> opt)",
"        : base(opt) { }",
"",
"    public DbSet<Product> Products => Set<Product>();",
"    public DbSet<Order> Orders => Set<Order>();",
"",
"    protected override void OnModelCreating(ModelBuilder mb)",
"    {",
"        mb.Entity<Product>(e =>",
"        {",
"            e.HasIndex(p => p.Name);",
"            e.HasIndex(p => p.Category);",
"            e.Property(p => p.CreatedAt).HasDefaultValueSql(\"NOW()\");",
"            e.Property(p => p.UpdatedAt).HasDefaultValueSql(\"NOW()\");",
"        });",
"        mb.Entity<Order>(e =>",
"        {",
"            e.HasIndex(o => o.Status);",
"            e.HasOne(o => o.Product)",
"             .WithMany(p => p.Orders)",
"             .HasForeignKey(o => o.ProductId)",
"             .OnDelete(DeleteBehavior.Restrict);",
"        });",
"    }",
"",
"    public override Task<int> SaveChangesAsync(",
"        CancellationToken ct = default)",
"    {",
"        foreach (var e in ChangeTracker.Entries<Product>()",
"            .Where(e => e.State == EntityState.Modified))",
"            e.Entity.UpdatedAt = DateTime.UtcNow;",
"        return base.SaveChangesAsync(ct);",
"    }",
"}"
].join("\n");

CODE["app-svc"] = [
"using Microsoft.EntityFrameworkCore;",
"using MyApp.Api.Data;",
"using MyApp.Api.Models;",
"",
"namespace MyApp.Api.Services;",
"",
"public class ProductService(",
"    AppDbContext write,",
"    ReadOnlyDbContext read,",
"    ILogger<ProductService> log) : IProductService",
"{",
"    // READS (in prod -> replicas, local -> same instance)",
"",
"    public async Task<List<Product>> GetAllAsync(string? cat)",
"    {",
"        var q = read.Products.Where(p => p.IsActive);",
"        if (!string.IsNullOrEmpty(cat))",
"            q = q.Where(p => p.Category == cat);",
"        return await q.OrderByDescending(p => p.CreatedAt)",
"                      .ToListAsync();",
"    }",
"",
"    public async Task<Product?> GetByIdAsync(int id) =>",
"        await read.Products",
"            .Include(p => p.Orders.OrderByDescending(o => o.CreatedAt).Take(10))",
"            .FirstOrDefaultAsync(p => p.Id == id);",
"",
"    public async Task<List<Product>> SearchAsync(string term) =>",
"        await read.Products",
"            .Where(p => p.IsActive",
"                && EF.Functions.ILike(p.Name, \"%\" + term + \"%\"))",
"            .Take(50).ToListAsync();",
"",
"    public async Task<List<Order>> GetOrdersAsync(int pid) =>",
"        await read.Orders.Where(o => o.ProductId == pid)",
"            .OrderByDescending(o => o.CreatedAt).Take(100).ToListAsync();",
"",
"    public async Task<DashboardStats> GetStatsAsync()",
"    {",
"        var prods = await read.Products.CountAsync(p => p.IsActive);",
"        var ords  = await read.Orders.CountAsync();",
"        var rev   = await read.Orders",
"            .Where(o => o.Status == \"confirmed\")",
"            .SumAsync(o => o.TotalPrice);",
"        return new(prods, ords, rev);",
"    }",
"",
"    // WRITES (in prod -> primary, local -> same instance)",
"",
"    public async Task<Product> CreateAsync(Product p)",
"    {",
"        log.LogInformation(\"Creating product: {Name}\", p.Name);",
"        write.Products.Add(p);",
"        await write.SaveChangesAsync();",
"        return p;",
"    }",
"",
"    public async Task<Product?> UpdateAsync(int id, Product u)",
"    {",
"        var p = await write.Products.FindAsync(id);",
"        if (p is null) return null;",
"        p.Name = u.Name; p.Description = u.Description;",
"        p.Price = u.Price; p.Stock = u.Stock;",
"        p.Category = u.Category; p.IsActive = u.IsActive;",
"        await write.SaveChangesAsync();",
"        return p;",
"    }",
"",
"    public async Task<bool> DeleteAsync(int id)",
"    {",
"        var p = await write.Products.FindAsync(id);",
"        if (p is null) return false;",
"        p.IsActive = false;",
"        await write.SaveChangesAsync();",
"        return true;",
"    }",
"",
"    public async Task<Order> PlaceOrderAsync(",
"        int pid, int qty, string? customer)",
"    {",
"        await using var tx = await write.Database",
"            .BeginTransactionAsync();",
"        try",
"        {",
"            var p = await write.Products.FindAsync(pid)",
"                ?? throw new KeyNotFoundException(\"Product not found\");",
"            if (p.Stock < qty)",
"                throw new InvalidOperationException(\"Insufficient stock\");",
"",
"            p.Stock -= qty;",
"            var order = new Order",
"            {",
"                ProductId = pid, Quantity = qty,",
"                TotalPrice = p.Price * qty,",
"                CustomerName = customer, Status = \"confirmed\"",
"            };",
"            write.Orders.Add(order);",
"            await write.SaveChangesAsync();",
"            await tx.CommitAsync();",
"            log.LogInformation(\"Order {Id} created\", order.Id);",
"            return order;",
"        }",
"        catch { await tx.RollbackAsync(); throw; }",
"    }",
"}"
].join("\n");

CODE["app-ctrl"] = [
"using Microsoft.AspNetCore.Mvc;",
"using MyApp.Api.Models;",
"using MyApp.Api.Services;",
"",
"namespace MyApp.Api.Controllers;",
"",
"[ApiController]",
"[Route(\"api/[controller]\")]",
"public class ProductsController(IProductService svc)",
"    : ControllerBase",
"{",
"    [HttpGet]",
"    public async Task<ActionResult<List<Product>>>",
"        GetAll([FromQuery] string? category)",
"        => Ok(await svc.GetAllAsync(category));",
"",
"    [HttpGet(\"{id:int}\")]",
"    public async Task<ActionResult<Product>> GetById(int id)",
"    {",
"        var p = await svc.GetByIdAsync(id);",
"        return p is null ? NotFound() : Ok(p);",
"    }",
"",
"    [HttpGet(\"search\")]",
"    public async Task<ActionResult<List<Product>>>",
"        Search([FromQuery] string q)",
"        => Ok(await svc.SearchAsync(q));",
"",
"    [HttpGet(\"{id:int}/orders\")]",
"    public async Task<ActionResult<List<Order>>>",
"        GetOrders(int id)",
"        => Ok(await svc.GetOrdersAsync(id));",
"",
"    [HttpGet(\"stats\")]",
"    public async Task<ActionResult<DashboardStats>>",
"        Stats() => Ok(await svc.GetStatsAsync());",
"",
"    [HttpPost]",
"    public async Task<ActionResult<Product>>",
"        Create(Product product)",
"    {",
"        var c = await svc.CreateAsync(product);",
"        return CreatedAtAction(",
"            nameof(GetById), new { id = c.Id }, c);",
"    }",
"",
"    [HttpPut(\"{id:int}\")]",
"    public async Task<ActionResult<Product>>",
"        Update(int id, Product product)",
"    {",
"        var u = await svc.UpdateAsync(id, product);",
"        return u is null ? NotFound() : Ok(u);",
"    }",
"",
"    [HttpDelete(\"{id:int}\")]",
"    public async Task<IActionResult> Delete(int id)",
"        => await svc.DeleteAsync(id) ? NoContent() : NotFound();",
"",
"    [HttpPost(\"{id:int}/orders\")]",
"    public async Task<ActionResult<Order>>",
"        PlaceOrder(int id, [FromBody] OrderReq req)",
"    {",
"        try {",
"            var o = await svc.PlaceOrderAsync(",
"                id, req.Quantity, req.CustomerName);",
"            return CreatedAtAction(",
"                nameof(GetOrders), new { id }, o);",
"        }",
"        catch (KeyNotFoundException) { return NotFound(); }",
"        catch (InvalidOperationException ex)",
"            { return BadRequest(new { error = ex.Message }); }",
"    }",
"}",
"",
"public record OrderReq(int Quantity, string? CustomerName);"
].join("\n");

// === ENGINE (identical to production version) ===
var activeRepo = "k8s";
var activeFile = null;
var openTabs = [];

function switchRepo(repo) {
  activeRepo = repo;
  document.querySelectorAll(".repo-tab").forEach(function(t){ t.classList.remove("active"); });
  document.querySelector(".repo-tab." + repo).classList.add("active");
  renderTree();
}
function renderTree() {
  var tree = TREE[activeRepo];
  var c = document.getElementById("tree-container");
  var h = "";
  for (var i = 0; i < tree.length; i++) {
    var item = tree[i];
    var indent = "";
    for (var j = 0; j < item.d; j++) indent += "<span class=\"tree-indent\"></span>";
    if (item.t === "f") {
      h += "<div class=\"tree-item folder\" onclick=\"toggleFolder(this)\">" + indent + "<span class=\"tree-chevron open\">\u25B6</span><span class=\"tree-icon\">\uD83D\uDCC1</span><span class=\"tree-name\">" + item.n + "</span></div>";
    } else {
      var act = activeFile === item.id ? " active" : "";
      h += "<div class=\"tree-item" + act + "\" onclick=\"selectFile('" + item.id + "')\">" + indent + "<span class=\"tree-icon\">" + item.ic + "</span><span class=\"tree-name\">" + item.n + "</span></div>";
    }
  }
  c.innerHTML = h;
}
window.toggleFolder = function(el) {
  var ch = el.querySelector(".tree-chevron");
  var isOpen = ch.classList.toggle("open");
  var myD = el.querySelectorAll(".tree-indent").length;
  var sib = el.nextElementSibling;
  while (sib) {
    var sd = sib.querySelectorAll(".tree-indent").length;
    if (sd <= myD) break;
    sib.style.display = isOpen ? "" : "none";
    sib = sib.nextElementSibling;
  }
};
window.selectFile = function(id) {
  activeFile = id;
  if (openTabs.indexOf(id) === -1) openTabs.push(id);
  renderTree(); renderTabs(); renderFile(id);
};
window.closeTab = function(id, ev) {
  ev.stopPropagation();
  openTabs = openTabs.filter(function(t){ return t !== id; });
  if (activeFile === id) activeFile = openTabs.length ? openTabs[openTabs.length-1] : null;
  renderTabs();
  if (activeFile) renderFile(activeFile); else renderEmpty();
  renderTree();
};
window.switchRepo = switchRepo;

function renderTabs() {
  var bar = document.getElementById("file-tab-bar");
  var h = "";
  for (var i = 0; i < openTabs.length; i++) {
    var id = openTabs[i];
    var m = FILE_META[id];
    if (!m) continue;
    var col = LANG_COLORS[m.l] || "#6366f1";
    var act = activeFile === id ? " active" : "";
    h += "<button class=\"file-tab" + act + "\" onclick=\"selectFile('" + id + "')\"><span class=\"dot\" style=\"background:" + col + "\"></span>" + m.f + "<span style=\"cursor:pointer;margin-left:6px;color:var(--text-dim);font-size:13px\" onclick=\"closeTab('" + id + "',event)\">\u00D7</span></button>";
  }
  bar.innerHTML = h;
}
function renderEmpty() {
  document.getElementById("content-area").innerHTML = "<div class=\"empty-state\"><div class=\"es-icon\">\uD83D\uDCC2</div><p>Select a file from the tree to view its contents.</p></div>";
}
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderFile(id) {
  var m = FILE_META[id];
  var code = CODE[id];
  if (!m || !code) return;
  var area = document.getElementById("content-area");
  var isK8s = TREE.k8s.some(function(t){ return t.id === id; });
  var repo = isK8s ? "k8s-local" : "MyApp.Api";
  var col = LANG_COLORS[m.l] || "#6366f1";
  var h = "<div class=\"file-content\">";
  h += "<div class=\"file-path\"><b>" + repo + "/</b>" + m.f + "</div>";
  h += "<div class=\"sec-header\"><div class=\"sec-title\">" + m.t + "</div><div class=\"sec-desc\">" + m.d + "</div></div>";
  if (m.notes) {
    for (var i = 0; i < m.notes.length; i++) {
      h += "<div class=\"info-note " + m.notes[i].c + "\">" + m.notes[i].h + "</div>";
    }
  }
  h += "<div class=\"code-block\"><div class=\"code-head\"><div class=\"code-head-left\"><div class=\"code-dot\" style=\"background:" + col + ";box-shadow:0 0 5px " + col + "55\"></div><span class=\"code-fname\">" + m.f + "</span><span class=\"code-lang\">" + m.l.toUpperCase() + "</span></div><button class=\"copy-btn\" onclick=\"doCopy(this,'" + id + "')\">Copy</button></div><pre class=\"code-body\">" + esc(code) + "</pre></div>";
  h += "</div>";
  area.innerHTML = h;
  area.scrollTop = 0;
}
window.doCopy = function(btn, id) {
  var code = CODE[id];
  if (!code) return;
  navigator.clipboard.writeText(code).then(function(){
    btn.textContent = "\u2713 Copied";
    btn.classList.add("copied");
    setTimeout(function(){ btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1500);
  });
};
renderTree();
})();
</script>
