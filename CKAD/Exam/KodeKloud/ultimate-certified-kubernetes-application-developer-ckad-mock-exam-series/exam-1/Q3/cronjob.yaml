apiVersion: batch/v1
kind: CronJob
metadata:
  name: simple-node-job
  namespace: ckad-job
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - name: node
            image: node
            command:
            - /bin/sh
            - "-c"
            - ps -eaf
          restartPolicy: Never