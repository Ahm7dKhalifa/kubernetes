apiVersion: batch/v1
kind: Job
metadata:
  name: alpine-job
  namespace: ckad-job
  labels:
    app: alpine-job
spec:
  template:
    metadata:
      labels:
        app: alpine-job
    spec:
      containers:
      - name: alpine
        image: alpine
        command:
        - /bin/sh
        - "-c"
        - "top -b -n 1"
      restartPolicy: OnFailure