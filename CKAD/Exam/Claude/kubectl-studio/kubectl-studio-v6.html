const LEAF_CAT={
  containers:'Containers', name:'Containers', image:'Containers', imagePullPolicy:'Containers',
  command:'Containers', args:'Containers', workingDir:'Containers', ports:'Containers', containerPort:'Containers',
  env:'Containers', envFrom:'Containers', resources:'Containers',
  livenessProbe:'Health Checks', readinessProbe:'Health Checks', startupProbe:'Health Checks',
  securityContext:'Security', serviceAccountName:'Security',
  volumes:'Storage', volumeMounts:'Storage', mountPath:'Storage',
  nodeSelector:'Scheduling', affinity:'Scheduling', tolerations:'Scheduling', priorityClassName:'Scheduling',
  dnsPolicy:'Networking', hostNetwork:'Networking', imagePullSecrets:'Networking', hostPID:'Networking', hostIPC:'Networking',
  initContainers:'Lifecycle', lifecycle:'Lifecycle', restartPolicy:'Lifecycle', terminationGracePeriodSeconds:'Lifecycle',
  template:'Pod Template',
};
function propCat(resId, fpath){
  const grp=GRP[resId]; if(!grp) return 999;
  const norm=fpath.replace(/\[\]/g,''); const segs=norm.split('.'); const leaf=segs[segs.length-1];
  const metaIdx=grp.findIndex(g=>/Metadata/i.test(g[0]));
  if(segs[0]==='metadata') return metaIdx<0?999:metaIdx;
  const CONTAINER_CAT={roleRef:'Role Reference',subjects:'Subjects',rules:'Rules',scaleTargetRef:'Target',metrics:'Metrics',scopeSelector:'Scopes'};
  for(const sg of segs){ if(CONTAINER_CAT[sg]){ const ci=grp.findIndex(g=>g[0]===CONTAINER_CAT[sg]); if(ci>=0) return ci; } }
  if(LEAF_CAT[leaf]){ const i=grp.findIndex(g=>g[0]===LEAF_CAT[leaf]); if(i>=0) return i; }
  for(let ci=0;ci<grp.length;ci++){ if(ci===metaIdx)continue; for(const tk of grp[ci][1]){ if(leaf===tk.split('.').pop()) return ci; } }
  for(let ci=0;ci<grp.length;ci++){ if(ci===metaIdx)continue; for(const tk of grp[ci][1]){ if(segs.includes(tk.split('.').pop())) return ci; } }
  return 999;
}
function propRank(resId, fpath){
  const grp=GRP[resId]; const ci=propCat(resId,fpath);
  if(!grp||ci>=grp.length) return [ci,999];
  const leaf=fpath.replace(/\[\]/g,'').split('.').pop();
  let wi=grp[ci][1].findIndex(tk=>tk.split('.').pop()===leaf);
  if(wi<0) wi=900;
  return [ci,wi];
}
function netpolExplainer(){
  const s=el('section',{class:'section'});
  s.appendChild(sectionTitle('Reading the rules: AND vs OR'));
  s.appendChild(el('p',{class:'prose',html:'Peer matching hinges on <strong>where the list dash <code>-</code> sits</strong>. Separate entries (each with its own <code>-</code>) are combined with <strong>OR</strong>; multiple selectors packed into the <em>same</em> entry are combined with <strong>AND</strong>. The same idea applies at every level.'}));
  const rules=el('ul',{class:'np-rules'});
  [['Multiple rules in <code>ingress</code>/<code>egress</code>','OR — traffic is allowed if it matches any rule'],
   ['Multiple peers in one <code>from</code>/<code>to</code>','OR — any listed source/destination is allowed'],
   ['Multiple selectors in one peer entry','AND — all selectors in that entry must match together'],
   ['<code>from</code> and <code>ports</code> within a rule','AND — the source must match and the port must match']
  ].forEach(([a,b])=>{ rules.appendChild(el('li',{},el('span',{html:a}),el('span',{class:'np-arrow'},' → '),el('span',{html:b}))); });
  s.appendChild(rules);
  const ex=(tag,cls,yaml,note)=>{
    const c=el('div',{class:'np-ex'});
    c.appendChild(el('div',{class:'np-ex-tag '+cls},tag));
    const pre=el('pre',{class:'yaml-out np-ex-pre'}); pre.innerHTML=highlightYAML(yaml); c.appendChild(pre);
    c.appendChild(el('div',{class:'np-ex-note',html:note}));
    return c;
  };
  s.appendChild(ex('OR','np-or',
`ingress:
- from:
  - podSelector:
      matchLabels:
        role: client
  - namespaceSelector:
      matchLabels:
        team: platform`,
'Two peers, each with its own <code>-</code> &rarr; <strong>OR</strong>. Allowed: pods labelled <code>role=client</code> in <em>this</em> namespace, <strong>or</strong> any pod in namespaces labelled <code>team=platform</code>.'));
  s.appendChild(ex('AND','np-and',
`ingress:
- from:
  - namespaceSelector:
      matchLabels:
        user: alice
    podSelector:
      matchLabels:
        role: client`,
'One peer, two selectors under a single <code>-</code> &rarr; <strong>AND</strong>. Allowed: <strong>only</strong> pods labelled <code>role=client</code> that <em>also live in</em> namespaces labelled <code>user=alice</code>. <strong>This is exactly your example — so it is AND.</strong>'));
  s.appendChild(ex('OR + AND','np-mix',
`ingress:
- from:
  - podSelector:
      matchLabels:
        app: gateway
  ports:
  - protocol: TCP
    port: 8080
- from:
  - ipBlock:
      cidr: 10.0.0.0/16
      except:
      - 10.0.5.0/24`,
'Two <em>rules</em> in <code>ingress</code> &rarr; <strong>OR</strong> between them. Inside rule&nbsp;1, <code>from</code> <strong>AND</strong> <code>ports</code> must both hold (gateway pods, on TCP 8080). Rule&nbsp;2 allows the CIDR range except the excluded subnet.'));
  s.appendChild(el('p',{class:'prose',html:'<strong>Tip:</strong> in the generator below, the <code>namespaceSelector + podSelector (AND)</code> peer type packs both into one entry (AND). To get OR instead, add two separate peers with <strong>add peer</strong>.'}));
  return s;
}

    const _ordered=_allProps.map((p,i)=>{const rk=propRank(res.id,p.f); return {p,i,c:rk[0],w:rk[1]};})
      .sort((a,b)=> (a.c-b.c) || (a.w-b.w) || (a.i-b.i) );
    let _prevC=null;
    _ordered.forEach(({p,c})=>{
      const _g=GRP[res.id]; const catName=(_g&&_g[c])?_g[c][0]:'Other';

        el('button',{class:'obtn',id:'btnDl'},el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>'}),'.yaml'))));
    const pre=el('pre',{class:'yaml-out',id:'yamlOut'});

      let obj=Object.assign({apiVersion:res.apiVersion,kind:res.kind},buildObj(res.gen.fields,genStates[res.id]));
      if(res.gen.transform) obj=res.gen.transform(obj);

    },0);
  }

  content.appendChild(page);
  window.scrollTo(0,0);
}

  s+=node('etcd', box(95,166,120,46,C_PLANE_FILL,C_PLANE)+lbl(155,194,'etcd',13,'#bcd4ff',500));
  s+=node('scheduler', box(248,166,165,46,C_PLANE_FILL,C_PLANE)+lbl(330,190,'kube-',12,'#bcd4ff')+lbl(330,204,'scheduler',12,'#bcd4ff'));

  // worker nodes
  function worker(x,name){
    let g='<rect x="'+x+'" y="318" width="396" height="210" rx="14" fill="none" stroke="'+C_NODE+'" stroke-width="1.5"/>';
    g+=lbl(x+78,340,name,12,C_NODE,600);

    g+=node('wpod', box(x+144,452,108,58,C_POD_FILL,C_POD)+lbl(x+198,485,'Pod',12,'#bcd4ff'));
    g+=node('wpod', box(x+264,452,108,58,C_POD_FILL,C_POD)+lbl(x+318,485,'Pod',12,'#bcd4ff'));
    return g;
  }
  s+=worker(48,'WORKER NODE 1');
  s+=worker(496,'WORKER NODE 2');
  // apiserver -> kubelets

  s+='<path d="M500 110 C660 250 700 280 694 350" stroke="#39506e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>';

  s+='</svg>';

}

  s+=node('configmap', box(40,360,150,46,'#1c2a1d','#3ecf8e')+lbl(115,388,'ConfigMap',12,'#9be8c2'));

  s+=node('pvc', box(750,390,150,46,'#16233c',C_PLANE)+lbl(825,418,'PVC',12,'#bcd4ff'));
  s+='<path d="M190 388 C250 400 270 450 298 466" stroke="#39506e" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#arr2)"/>';
  s+='<path d="M190 444 C250 470 275 478 298 480" stroke="#39506e" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#arr2)"/>';

const DIAGRAMS=[
  {id:'cluster', label:'Cluster Components', build:diagramCluster,
   legend:[['#326ce5','control plane'],['#2dd4bf','worker node'],['#5b8ad6','pods']]},
  {id:'rel', label:'Resource Relationships', build:diagramRel,
   legend:[['#326ce5','traffic / routing'],['#2dd4bf','controllers'],['#3ecf8e','config'],['#f5a623','secrets']]},
];

function renderArchitecture(){
  content.innerHTML='';
  const page=el('div');
  const head=el('div',{class:'page-head'});
  head.appendChild(el('div',{class:'eyebrow'},'Core Concepts'));
  head.appendChild(el('h2',{},'Cluster Architecture'));
  head.appendChild(el('p',{class:'lede'},'How the pieces fit together. Tap any component to see what it does — the same mental model the CKAD assumes you carry into the terminal.'));
  page.appendChild(head);

  const sec=el('section',{class:'section'});
  const tabs=el('div',{class:'diagram-tabs'});
  const boxEl=el('div',{class:'diagram-box'});
  const info=el('div',{class:'diag-info',html:'<strong>Tip</strong> &nbsp;tap a box in the diagram to read what each component does.'});
  const legend=el('div',{class:'diag-legend'});

  function show(d){
    [...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.id===d.id));
    boxEl.innerHTML=d.build();
    legend.innerHTML='';
    d.legend.forEach(l=>{
      legend.appendChild(el('div',{class:'lg'},el('i',{style:'background:'+l[0]}),l[1]));
    });
    info.innerHTML='<strong>Tip</strong> &nbsp;tap a box in the diagram to read what each component does.';
    boxEl.querySelectorAll('.diag-node').forEach(n=>{
      n.addEventListener('click',()=>{
        const k=n.getAttribute('data-key'); const d2=DIAG_INFO[k];
        if(d2) info.innerHTML='<strong>'+d2.t+'</strong><br>'+d2.d;
      });
    });
  }
  DIAGRAMS.forEach(d=>{
    tabs.appendChild(el('button',{class:'dtab','data-id':d.id,onclick:()=>show(d)},d.label));
  });
  sec.appendChild(tabs); sec.appendChild(boxEl); sec.appendChild(legend); sec.appendChild(info);
  page.appendChild(sec);
  content.appendChild(page);
  show(DIAGRAMS[0]);
  window.scrollTo(0,0);
}

/* ============================================================
   CKAD EXAM GUIDE
   ============================================================ */
function renderExam(){
  content.innerHTML='';
  const page=el('div');
  const head=el('div',{class:'page-head'});
  head.appendChild(el('div',{class:'eyebrow'},'Strategy'));
  head.appendChild(el('h2',{},'CKAD Exam Guide'));
  head.appendChild(el('p',{class:'lede'},'2 hours, ~16 hands-on tasks, a live cluster and a browser terminal. Speed and muscle memory win. Here is the setup and the commands worth burning into your fingers.'));
  page.appendChild(head);

  // setup callouts
  const setup=el('section',{class:'section'});
  setup.appendChild(sectionTitle('Before You Touch a Task'));
  [['tip','Set your shell up first','Run these once at the start of the exam to make everything faster.'],
   ['warn','Always set the namespace','Most tasks specify a namespace. Use <code>-n</code> on every command or set the context default — wrong-namespace answers score zero.'],
   ['info','Bookmarks are allowed','You may use the official kubernetes.io docs during the exam. Practise navigating them quickly; do not rely on them for syntax you should know cold.']
  ].forEach(c=>{
    const ic=c[0]==='warn'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'
      : c[0]==='tip'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    setup.appendChild(el('div',{class:'callout '+c[0]},el('span',{class:'ci',html:ic}),el('p',{html:'<strong>'+c[1]+'</strong><br>'+c[2]})));
  });
  page.appendChild(setup);

  function cmdSection(title,intro,cmds){
    const cs=el('section',{class:'section'});
    cs.appendChild(sectionTitle(title));
    if(intro)cs.appendChild(el('p',{class:'prose',html:intro}));
    const list=el('div',{class:'cmd-list'});
    cmds.forEach(cm=>{
      const c=el('div',{class:'cmd'});
      const line=el('div',{class:'cmd-line'});
      line.appendChild(el('span',{class:'prompt'},'$'));
      line.appendChild(el('code',{},cm[0]));
      line.appendChild(el('button',{class:'copy-cmd',onclick:()=>copyText(cm[0],'command copied')},'copy'));
      c.appendChild(line);
      if(cm[1])c.appendChild(el('div',{class:'cmd-desc',html:cm[1]}));
      list.appendChild(c);
    });
    cs.appendChild(list);
    page.appendChild(cs);
  }

  cmdSection('Shell Setup','Paste at the start. The alias is the single biggest time-saver on the exam.',[
    ["alias k=kubectl",'Type <code>k</code> instead of <code>kubectl</code> everywhere.'],
    ["export do='--dry-run=client -o yaml'",'Now <code>k run ... $do</code> prints a manifest instead of creating the object.'],
    ["export ns='-n jahez-prod'",'Reuse a namespace flag you will type a hundred times.'],
    ["source <(kubectl completion bash)",'Tab-completion for resources and flags.']
  ]);

  cmdSection('Generate, Don\u2019t Type','The golden pattern: let kubectl write the YAML, then edit. Faster and error-free.',[
    ["k run jahez-api --image=registry.jahez.net/api:1.0 $do > pod.yaml",'Scaffold a Pod manifest you can tweak.'],
    ["k create deploy jahez-api --image=registry.jahez.net/api:1.0 --replicas=3 $do > deploy.yaml",'Scaffold a Deployment.'],
    ["k create job backfill --image=busybox $do -- /bin/sh -c 'echo hi'",'Scaffold a Job with a command.'],
    ["k create cj report --image=busybox --schedule='*/5 * * * *' $do -- date",'Scaffold a CronJob.'],
    ["k create cm app-config --from-literal=TZ=Asia/Riyadh $do",'Scaffold a ConfigMap from literals.'],
    ["k create secret generic db --from-literal=password=s3cr3t $do",'Scaffold a Secret.'],
    ["k expose deploy jahez-api --port=80 --target-port=8080 $do",'Generate a Service for an existing Deployment.']
  ]);

  cmdSection('Inspect Fast',null,[
    ["k get pods -A -o wide",'All pods, all namespaces, with node + IP.'],
    ["k describe pod jahez-api","Events at the bottom are where you find why a pod won\u2019t start."],
    ["k logs jahez-api -c sidecar --previous","Logs from a named container, including the crashed instance."],
    ["k get pod jahez-api -o jsonpath='{.spec.containers[*].image}'","Pull one field without scrolling YAML."],
    ["k explain deployment.spec.strategy --recursive","Field reference straight from the API server — no internet needed."]
  ]);

  cmdSection('Edit, Scale, Debug',null,[
    ["k edit deploy jahez-api","Live-edit an object; saves apply on close."],
    ["k scale deploy jahez-api --replicas=5","Scale without editing YAML."],
    ["k set image deploy/jahez-api api=registry.jahez.net/api:1.1","Trigger a rolling update in one line."],
    ["k rollout undo deploy/jahez-api","Roll back the last bad deploy."],
    ["k run tmp --image=busybox -it --rm --restart=Never -- sh","Throwaway debug pod with an interactive shell."],
    ["k delete pod jahez-api --grace-period=0 --force","Force-delete a stuck pod when time is short."]
  ]);

  const out=el('section',{class:'section'});
  out.appendChild(el('div',{class:'callout tip'},
    el('span',{class:'ci',html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>'}),
    el('p',{html:'<strong>Flag every uncertain task and move on.</strong> Easy marks are spread across all 16 questions — never sink 20 minutes into one. Come back if time allows.'})));
  page.appendChild(out);

  content.appendChild(page);
  window.scrollTo(0,0);
}

const SPECIAL={
  home:{group:'Getting Started',label:'Dashboard',render:renderHome},
  architecture:{group:'Getting Started',label:'Cluster Architecture',render:renderArchitecture},
  exam:{group:'Getting Started',label:'CKAD Exam Guide',render:renderExam},
};
function setBreadcrumb(group,leaf){
  const bc=document.getElementById('breadcrumb');
  bc.innerHTML='';
  bc.appendChild(el('span',{},group));
  bc.appendChild(el('span',{class:'sep'},'/'));
  bc.appendChild(el('span',{class:'cur'},leaf));
}
function groupOf(id){
  const g=GROUPS.find(gr=>gr.items.some(it=>it.id===id));
  return g?g.name:'';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
function navigate(id){
  if(SPECIAL[id]){
    SPECIAL[id].render();
    setBreadcrumb(SPECIAL[id].group,SPECIAL[id].label);
  } else if(RES[id]){
    renderResource(RES[id]);
    setBreadcrumb(groupOf(id),RES[id].kind);
  } else { return; }
  setActive(id);
  closeSidebar();
}

  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
});
document.getElementById('backdrop').addEventListener('click',closeSidebar);

buildSidebar();
