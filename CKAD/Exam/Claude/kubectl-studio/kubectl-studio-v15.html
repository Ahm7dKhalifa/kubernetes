  storage:'The single version objects are persisted as in etcd. Exactly one version across the CRD must be the storage version; others are converted to/from it.',
  specProps:'The fields your custom resource’s <code>spec</code> accepts, each mapped to an OpenAPI type (<code>string</code>, <code>integer</code>, <code>boolean</code>, <code>array</code>, <code>object</code>). This becomes the structural schema the API uses to validate instances.',
  plural:'The lowercase plural used in URLs and <code>kubectl get &lt;plural&gt;</code> (e.g. <code>widgets</code>). It’s the first half of the CRD’s required name.',
  shortNames:'Optional kubectl shortcuts for your kind (e.g. <code>wi</code> so <code>kubectl get wi</code> works), mirroring built-ins like <code>svc</code> for services.',
  allowPrivilegeEscalation:'Whether a process can gain more privileges than its parent (e.g. via setuid). Set it <code>false</code> to block a whole class of privilege-escalation exploits \u2014 a recommended default.',
  runAsGroup:'The primary group ID (GID) the container process runs as. Files the process creates are owned by this group. Pair it with <code>runAsUser</code> to run fully as a chosen non-root identity.',
  privileged:'Gives the container almost unrestricted access to the host \u2014 all capabilities, host devices, and the ability to reconfigure the kernel, essentially root <em>on the node</em>. Almost never needed; a privileged container can take over the host, so keep it <code>false</code> and grant specific <code>capabilities</code> instead.',
  procMount:'Controls masking of <code>/proc</code> inside the container. <code>Default</code> masks and makes read-only the sensitive paths (recommended); <code>Unmasked</code> exposes the host\u2019s full <code>/proc</code> \u2014 only for tools like in-container container runtimes, and it requires an unconfined seccomp profile.',
  capabilities:'Fine-grained Linux kernel privileges added to or dropped from the container\u2019s default set \u2014 a far safer alternative to <code>privileged</code>. Best practice: <code>drop: [ALL]</code> then <code>add</code> back only the few powers the app truly needs.',
  add:'Linux capabilities to grant on top of the runtime\u2019s defaults \u2014 names without the <code>CAP_</code> prefix. Common ones: <code>NET_ADMIN</code> (manage interfaces/routes/firewall), <code>SYS_TIME</code> (set the system clock), <code>NET_BIND_SERVICE</code> (bind ports below 1024), <code>SYS_PTRACE</code> (debug other processes).',
  drop:'Linux capabilities to remove from the container. The hardening default is <code>drop: [ALL]</code> \u2014 strip every capability, then <code>add</code> back only what\u2019s required. Least privilege for kernel powers.',
  seccompProfile:'Applies a seccomp filter that restricts which Linux syscalls the container may make, shrinking the kernel attack surface. <code>RuntimeDefault</code> uses the runtime\u2019s curated allow-list (recommended); <code>Localhost</code> loads a custom profile from <code>localhostProfile</code>; <code>Unconfined</code> disables filtering.',
  seLinuxOptions:'SELinux labels applied to the container process and its volume mounts on SELinux-enforcing nodes. Usually leave it to the platform; set <code>level</code>/<code>user</code>/<code>role</code>/<code>type</code> only when integrating with a specific SELinux policy (e.g. a shared MCS <code>level</code> so two Pods can access the same volume).',
  fsGroupChangePolicy:'When Kubernetes re-owns mounted volumes to <code>fsGroup</code>: <code>Always</code> chowns the whole volume on every mount (slow for large PVs); <code>OnRootMismatch</code> only fixes permissions when the volume\u2019s top-level dir group is wrong \u2014 much faster, and the sensible default.',
  supplementalGroups:'Extra group IDs (GIDs) added to the container process beyond its primary group \u2014 useful for shared access to group-owned files or NFS exports. Integers, merged with the groups the container image already defines.',
  sysctls:'Namespaced kernel parameters set for the Pod, e.g. <code>net.core.somaxconn</code> or <code>net.ipv4.tcp_syncookies</code>. Only \u201csafe\u201d sysctls are allowed by default; \u201cunsafe\u201d ones must be explicitly enabled on the kubelet. Each is a <code>name</code>/<code>value</code> string pair.',
  fsGroup:'A supplemental group ID applied to mounted volumes so the container (running as a non-root user) can read/write them. The fix when a non-root Pod gets \u201cpermission denied\u201d on a PVC.',
  effect:'For a taint/toleration, the action: <code>NoSchedule</code> (don\u2019t place new Pods), <code>PreferNoSchedule</code> (avoid if possible), or <code>NoExecute</code> (also evict running Pods). It sets how strongly the taint repels.',
  operator:'For a toleration, how to match the taint: <code>Equal</code> (key and value must match) or <code>Exists</code> (match the key regardless of value). <code>Exists</code> with no key tolerates everything.',
  medium:'For an <code>emptyDir</code>, where it lives: blank means node disk; <code>Memory</code> makes it a RAM-backed tmpfs \u2014 very fast but counts against the container\u2019s memory limit and is lost on restart.',
  scheme:'For an HTTP probe, whether to use <code>HTTP</code> (default) or <code>HTTPS</code> when hitting the path. Set HTTPS when the app only serves TLS on that port.',
  hard:'Aggregate ceilings for the whole namespace, written as <code>resource: quantity</code> pairs, in four categories.<br><br><strong>Compute</strong> \u2014 <code>requests.cpu</code>, <code>requests.memory</code>, <code>limits.cpu</code>, <code>limits.memory</code>, <code>requests.ephemeral-storage</code>, <code>limits.ephemeral-storage</code>, and extended resources like <code>requests.nvidia.com/gpu</code>.<br><strong>Storage</strong> \u2014 <code>requests.storage</code> (all PVCs combined), <code>persistentvolumeclaims</code> (count), and per-class <code>&lt;class&gt;.storageclass.storage.k8s.io/requests.storage</code> and <code>\u2026/persistentvolumeclaims</code>.<br><strong>Object counts (named)</strong> \u2014 <code>pods</code>, <code>services</code>, <code>services.loadbalancers</code>, <code>services.nodeports</code>, <code>secrets</code>, <code>configmaps</code>, <code>replicationcontrollers</code>, <code>resourcequotas</code>.<br><strong>Object counts (generic)</strong> \u2014 <code>count/&lt;resource&gt;.&lt;group&gt;</code>, e.g. <code>count/deployments.apps</code>, <code>count/jobs.batch</code>, <code>count/cronjobs.batch</code>, <code>count/ingresses.networking.k8s.io</code>.<br><br>Once any <code>requests.*</code>/<code>limits.*</code> is set, every Pod must declare the matching field or it\u2019s rejected. <code>pods</code> counts only non-terminal Pods (Succeeded/Failed don\u2019t count).',
  scopes:'Restricts the quota to a class of Pods \u2014 e.g. <code>BestEffort</code>, <code>NotBestEffort</code>, <code>Terminating</code>, <code>NotTerminating</code>. Use it to quota, say, only long-running Pods separately from short-lived ones.',
  scopeSelector:'Like <code>scopes</code> but expression-based \u2014 match a scope with an operator. The main use is <code>PriorityClass</code>: <code>{scopeName: PriorityClass, operator: In, values: [jahez-high-priority]}</code> applies the quota only to Pods of that priority class.',
  scopeName:'Which scope the expression tests \u2014 <code>PriorityClass</code>, <code>BestEffort</code>, <code>NotBestEffort</code>, <code>Terminating</code>, <code>NotTerminating</code>, <code>CrossNamespacePodAffinity</code>. Only <code>PriorityClass</code> takes <code>In</code>/<code>NotIn</code> with values; the rest use <code>Exists</code>/<code>DoesNotExist</code>.',
  minAvailable:'For a PodDisruptionBudget, the number (or %) of Pods that must stay <em>available</em> during voluntary disruptions like a node drain. Evictions that would drop below this are blocked.',
  maxUnavailable:'For a PodDisruptionBudget, the number (or %) of Pods that may be <em>down</em> at once during voluntary disruptions. The mirror image of minAvailable \u2014 set one, not both.',
  globalDefault:'On a PriorityClass, makes it the priority for any Pod that names no class. Only one PriorityClass cluster-wide may set this to true.',
  preemptionPolicy:'Whether a higher-priority pending Pod may <em>evict</em> lower-priority Pods to make room: <code>PreemptLowerPriority</code> (default) does; <code>Never</code> only jumps the scheduling queue without evicting anyone.',
  scaleTargetRef:'The workload the HPA scales \u2014 its apiVersion, kind and name (usually a Deployment). The HPA writes the chosen replica count back onto this target.',
  minReplicas:'The floor the HPA will scale down to. Keep it above 1 for availability so a brief lull doesn\u2019t drop you to a single Pod.',
  maxReplicas:'The ceiling the HPA will scale up to \u2014 your protection against a runaway scale-out exhausting the cluster (and your budget).',
  metrics:'What the HPA watches to decide replica count \u2014 most commonly CPU or memory <em>Utilization</em> as a percentage of the Pod\u2019s request. It adds replicas when the metric is above target and removes them when below.',
  averageUtilization:'The target metric value, as a percentage of the resource <em>request</em>, the HPA tries to maintain across Pods \u2014 e.g. 70 means \u201ckeep average CPU near 70% of requested.\u201d Requires resource requests to be set.',
};
function fieldExplain(f){
  let base = FIELD_TIPS[f.key] || f.hint || ('The <code>'+esc(f.key)+'</code> field of this resource.');
  if(f.type==='variant'&&f.variants){
    base += '<br><br><strong>One of</strong> (pick from the dropdown): '
      + f.variants.map(v=>'<code>'+esc(v.value)+'</code>').join(', ') + '.';
  }
  return base;
}
function sampleScalar(f){
  if(f.type==='select'&&f.bool) return (f.default==='true'||f.default===true);
  if(f.type==='number') return f.default!=null?Number(f.default):3;
  if(f.type==='boolean') return f.default!=null?!!f.default:true;
  if(f.type==='select') return (f.options&&f.options.length?f.options[0]:'value');
  if(f.default!=null&&f.default!=='') return f.default;
  if(f.placeholder) return f.placeholder;
  return 'value';
}
function pickSub(list){
  const important=list.filter(x=>x.req||!x.optional);
  return (important.length?important:list).slice(0,6);
}
function sampleValue(f){
  switch(f.type){
    case 'object': { const o={}; pickSub(f.fields||[]).forEach(sf=>{ if(sf.type==='variant'&&sf.spread)Object.assign(o,sampleValue(sf)); else o[sf.key]=sampleValue(sf); }); return o; }
    case 'array': { const it={}; pickSub(f.itemFields||[]).forEach(sf=>{ if(sf.type==='variant'&&sf.spread)Object.assign(it,sampleValue(sf)); else it[sf.key]=sampleValue(sf); }); return [it]; }
    case 'list': return (f.defaultItems&&f.defaultItems.length)?f.defaultItems.slice(0,3):['item-1','item-2'];
    case 'keyvalue': { const o={}; const ps=(f.defaultPairs&&f.defaultPairs.length)?f.defaultPairs:[['app','jahez-api']]; ps.forEach(p=>{o[p[0]||'key']=p[1]||'value';}); return o; }
    case 'variant': { const v=f.variants[0]; const built={}; pickSub(v.fields).forEach(sf=>{built[sf.key]=sampleValue(sf);});
      let obj=v.map?v.map(built):(function(){const t={};t[v.value]=built;return t;})();
      if(f.common) pickSub(f.common).forEach(sf=>{obj[sf.key]=sampleValue(sf);}); return obj; }
    default: return sampleScalar(f);
  }
}
function fieldYAMLExample(f){
  if(f.type==='variant'&&f.spread) return toYAML(sampleValue(f));
  const o={}; o[f.key]=sampleValue(f); return toYAML(o);
}
function variantExampleYAML(f,v){
  const built={}; pickSub(v.fields).forEach(sf=>{built[sf.key]=sampleValue(sf);});
  let obj = v.map ? v.map(built) : (function(){const t={};t[v.value]=built;return t;})();
  if(f.common) pickSub(f.common).forEach(sf=>{obj[sf.key]=sampleValue(sf);});
  if(f.spread) return toYAML(obj);
  const o={}; o[f.key]=obj; return toYAML(o);
}
function arrayVariantExampleYAML(f,av,v){
  const item={};
  f.itemFields.forEach(sf=>{
    if(sf===av){
      const built={}; pickSub(v.fields).forEach(x=>{built[x.key]=sampleValue(x);});
      const obj=v.map?v.map(built):(function(){const t={};t[v.value]=built;return t;})();
      if(av.spread) Object.assign(item,obj); else item[av.key]=obj;
    } else if(!(sf.type==='variant'&&sf.spread)){
      item[sf.key]=sampleValue(sf);
    }
  });
  const o={}; o[f.key]=[item]; return toYAML(o);
}

let _tip=null,_tipAnchor=null;
function hideFieldTip(){
  if(_tip){ _tip.remove(); _tip=null; }
  if(_tipAnchor){ _tipAnchor.classList.remove('open'); _tipAnchor=null; }
}
function toggleFieldTip(anchor,f){
  if(_tipAnchor===anchor){ hideFieldTip(); return; }
  hideFieldTip();
  _tip=el('div',{class:'tip-pop'});
  _tip.appendChild(el('div',{class:'tip-head'},
    el('span',{class:'tip-key'},f.label),
    el('button',{class:'tip-x',onclick:hideFieldTip},'\u00d7')));
  _tip.appendChild(el('div',{class:'tip-desc',html:fieldExplain(f)}));
  const _av=(f.type==='array'&&f.itemFields)?f.itemFields.find(x=>x.type==='variant'):null;
  if(f.type==='variant'&&f.variants){
    f.variants.forEach(v=>{
      _tip.appendChild(el('div',{class:'tip-eg-label'},(v.label||v.value)));
      const pre=el('pre',{class:'tip-code'}); pre.innerHTML=highlightYAML(variantExampleYAML(f,v));
      _tip.appendChild(pre);
    });
  } else if(_av){
    _av.variants.forEach(v=>{
      _tip.appendChild(el('div',{class:'tip-eg-label'},(v.label||v.value)));
      const pre=el('pre',{class:'tip-code'}); pre.innerHTML=highlightYAML(arrayVariantExampleYAML(f,_av,v));
      _tip.appendChild(pre);
    });
  } else {
    _tip.appendChild(el('div',{class:'tip-eg-label'},'example'));
    const pre=el('pre',{class:'tip-code'}); pre.innerHTML=highlightYAML(fieldYAMLExample(f));
    _tip.appendChild(pre);
  }
  const row=anchor.closest('.fld-row')||anchor;
  row.insertAdjacentElement('afterend', _tip);
  anchor.classList.add('open'); _tipAnchor=anchor;
}

function collapseBtn(collapsed,fpath,ctx){
  return el('button',{class:'fld-tog',type:'button',title:'collapse / expand',
    onclick:e=>{ const fld=e.currentTarget.closest('.fld');
      const col=fld.classList.toggle('fld-collapsed');
      e.currentTarget.textContent=col?'+':'\u2212';
      if(ctx&&ctx.expanded&&fpath){ if(col) ctx.expanded.delete(fpath); else ctx.expanded.add(fpath); } }},
    collapsed?'+':'\u2212');
}

function itemTog(collapsed,ipath,ctx){
  return el('button',{class:'fld-tog',type:'button',title:'collapse / expand',
    onclick:e=>{ const it=e.currentTarget.closest('.arr-item');
      const col=it.classList.toggle('arr-item-collapsed');
      e.currentTarget.textContent=col?'+':'\u2212';
      if(ctx&&ctx.expanded&&ipath){ if(col) ctx.expanded.delete(ipath); else ctx.expanded.add(ipath); } }},
    collapsed?'+':'\u2212');
}

function sectionHeading(label){
  const m=SECTION_META[label]||{q:'',c:'#2dd4bf'};
  const tag=el('div',{class:'sec-tag'});
  tag.style.setProperty('--sc',m.c);
  tag.appendChild(el('span',{class:'sec-hash'},'#'));
  tag.appendChild(el('span',{class:'sec-name'},label));
  if(m.q) tag.appendChild(el('span',{class:'sec-q'},'— '+m.q));
  return tag;
}
function renderFields(fields,state,ctx,base){
  base=base||'';
  const frag=document.createDocumentFragment();
  let lastSection=null;
  for(const f of fields){
    if(f.section && f.section!==lastSection){ frag.appendChild(sectionHeading(f.section)); lastSection=f.section; }
    const s=state[f.key];
    const fpath=base+'/'+f.key;
    const collapsed=(f.type!=='boolean') && !(ctx.expanded&&ctx.expanded.has(fpath));
    const wrap=el('div',{class:'fld'+((f.optional&&!s.enabled)?' fld-disabled':'')+(collapsed?' fld-collapsed':'')});

    if(f.type==='boolean'){
      const row=el('div',{class:'fld-row'});
      row.appendChild(el('input',{type:'checkbox',class:'chk',checked:s.enabled,
        onchange:e=>{ s.enabled=e.target.checked; ctx.regen(); }}));
      row.appendChild(fieldLabel(f));
      wrap.appendChild(row);
      if(f.hint) wrap.appendChild(el('div',{class:'hint'},f.hint));
      frag.appendChild(wrap); continue;
    }

    if(f.type==='rbacrule'){
      const plain=el('div',{class:'fld'});
      plain.appendChild(renderRbacRule(s,ctx));
      frag.appendChild(plain); continue;
    }

    const row=el('div',{class:'fld-row'});
    if(f.optional) row.appendChild(enableChk(f,s,ctx,fpath));
    row.appendChild(fieldLabel(f));
    row.appendChild(collapseBtn(collapsed,fpath,ctx));
    wrap.appendChild(row);
    if(f.hint) wrap.appendChild(el('div',{class:'hint'},f.hint));

    if(f.type==='object'){
      const nest=el('div',{class:'nest'+((f.optional&&!s.enabled)?' dim':'')});
      nest.appendChild(renderFields(f.fields,s.value,ctx,fpath));
      wrap.appendChild(nest);
    }
    else if(f.type==='array'){
      const box=el('div',{class:(f.optional&&!s.enabled)?'nest dim':''});
      s.items.forEach((itState,idx)=>{
        const ipath=fpath+'#'+idx;
        const itCol=!(ctx.expanded&&ctx.expanded.has(ipath));
        const card=el('div',{class:'arr-item'+(itCol?' arr-item-collapsed':'')});
        const head=el('div',{class:'arr-item-head'});
        head.appendChild(itemTog(itCol,ipath,ctx));
        head.appendChild(el('span',{class:'ai-title'},(f.itemLabel||f.key)+' #'+(idx+1)));
        head.appendChild(el('button',{class:'btn-rm',title:'remove',
          onclick:()=>{ s.items.splice(idx,1); ctx.paint(); }},'×'));
        card.appendChild(head);
        card.appendChild(renderFields(f.itemFields,itState,ctx,ipath));
        box.appendChild(card);
      });
      const add=el('button',{class:'btn-add',
        onclick:()=>{ if(f.optional&&!s.enabled)s.enabled=true;
          if(ctx.expanded) ctx.expanded.add(fpath+'#'+s.items.length);
          s.items.push(defaultState(f.itemFields)); ctx.paint(); }},
        el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}),
        'add '+(f.itemLabel||f.key));
      box.appendChild(add);
      wrap.appendChild(box);
    }
    else if(f.type==='list'){
      const box=el('div',{class:(f.optional&&!s.enabled)?'nest dim':''});
      s.items.forEach((val,idx)=>{
        const r=el('div',{class:'list-row'});
        let inp;
        if(f.options){
          inp=el('select',{});
          f.options.forEach(op=>{ const o=el('option',{value:op},op); if(val===op)o.selected=true; inp.appendChild(o); });
          inp.addEventListener('change',e=>{ s.items[idx]=e.target.value; ctx.regen(); });
        } else {
          inp=el('input',{type:'text',value:val,placeholder:f.placeholder||''});
          inp.addEventListener('input',e=>{ s.items[idx]=e.target.value; ctx.regen(); });
        }
        r.appendChild(inp);
        r.appendChild(el('button',{class:'btn-rm',onclick:()=>{ s.items.splice(idx,1); ctx.paint(); }},'×'));
        box.appendChild(r);
      });
      box.appendChild(el('button',{class:'btn-add',
        onclick:()=>{ if(f.optional&&!s.enabled)s.enabled=true; s.items.push(f.options?f.options[0]:''); ctx.paint(); }},
        el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}),'add item'));
      wrap.appendChild(box);
    }
    else if(f.type==='keyvalue'){
      const box=el('div',{class:(f.optional&&!s.enabled)?'nest dim':''});
      s.pairs.forEach((pair,idx)=>{
        const r=el('div',{class:'kv-row'});
        const k=el('input',{type:'text',value:pair[0],placeholder:f.kPlaceholder||'key'});
        k.addEventListener('input',e=>{ pair[0]=e.target.value; ctx.regen(); });
        const v=el('input',{type:'text',value:pair[1],placeholder:f.vPlaceholder||'value'});
        v.addEventListener('input',e=>{ pair[1]=e.target.value; ctx.regen(); });
        r.appendChild(k); r.appendChild(el('span',{class:'kv-eq'},':')); r.appendChild(v);
        r.appendChild(el('button',{class:'btn-rm',onclick:()=>{ s.pairs.splice(idx,1); ctx.paint(); }},'×'));
        box.appendChild(r);
      });
      box.appendChild(el('button',{class:'btn-add',
        onclick:()=>{ if(f.optional&&!s.enabled)s.enabled=true; s.pairs.push(['','']); ctx.paint(); }},
        el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}),'add pair'));
      wrap.appendChild(box);
    }
    else if(f.type==='variant'){
      const nest=el('div',{class:'nest'+((f.optional&&!s.enabled)?' dim':'')});
      const selWrap=el('div',{class:'fld'});
      selWrap.appendChild(el('div',{class:'fld-row'},el('label',{class:'fld-name'},el('span',{class:'fn-text'},f.selectorLabel||'type'))));
      const sel=el('select',{disabled:(f.optional&&!s.enabled)?'disabled':false});
      f.variants.forEach(v=>{ const o=el('option',{value:v.value},v.label||v.value); if(s.sel===v.value)o.selected=true; sel.appendChild(o); });
      sel.addEventListener('change',e=>{ s.sel=e.target.value; if(f.optional&&!s.enabled)s.enabled=true; ctx.paint(); });
      selWrap.appendChild(sel);
      nest.appendChild(selWrap);
      const v=f.variants.find(x=>x.value===s.sel)||f.variants[0];
      nest.appendChild(renderFields(v.fields,s.vstate[s.sel],ctx,fpath+':'+s.sel));
      if(f.common) nest.appendChild(renderFields(f.common,s.cstate,ctx,fpath+':common'));
      wrap.appendChild(nest);
    }
    else {
      wrap.appendChild(scalarInput(f,s,ctx));
    }
    frag.appendChild(wrap);
  }
  return frag;
}

  {group:'events.k8s.io', resources:['events']},

const RBAC_VERBS=['get','list','watch','create','update','patch','delete','deletecollection','bind','escalate','impersonate','use','*'];
const RES2GROUP=(function(){const m={};RBAC_GROUPS.forEach(g=>g.resources.forEach(r=>{ if(!(r in m)) m[r]=g.group; }));return m;})();
const KNOWN_RES=new Set(Object.keys(RES2GROUP));
function rbacGroupLabel(g){const e=RBAC_GROUPS.find(x=>x.group===g);return e?(e.label||g):g;}
function rbacComputeGroups(resources,extra){
  const s=new Set();
  (resources||[]).forEach(r=>{ if(r!=='' && (r in RES2GROUP)) s.add(RES2GROUP[r]); });
  (extra||[]).forEach(g=>{ if(g!=='') s.add(g); else s.add(''); });
  if(!s.size) return [''];
  const arr=[...s]; arr.sort((a,b)=> a===''?-1 : b===''?1 : a.localeCompare(b)); return arr;
}
function buildRbacRule(s){
  const verbs=(s.verbs||[]).filter(x=>x!=='');
  if(s.allowNonResource && s.mode==='nonResource'){
    const urls=(s.nonResourceURLs||[]).filter(x=>x!=='');
    return {nonResourceURLs:urls.slice(), verbs:verbs.slice()};
  }
  const resources=(s.resources||[]).filter(x=>x!=='');
  const rule={apiGroups:rbacComputeGroups(resources,s.extraGroups), resources:resources.slice(), verbs:verbs.slice()};
  const rn=(s.resourceNames||[]).filter(x=>x!=='');
  if(rn.length) rule.resourceNames=rn;
  return rule;
}
function renderRbacRule(s,ctx){
  const box=el('div',{class:'rbac-rule'});

    const c=el('div',{class:'rbac-chips'});
    opts.forEach(o=>{ const chip=el('button',{class:'rbac-chip'+(isSel(o)?' sel':'')+(ro?' ro':''),type:'button',
      onclick:ro?null:(e=>{ e.preventDefault(); onToggle(o); ctx.paint(); })}, o===''?'"" (core)':o);
      c.appendChild(chip); });
    return c;
  };
  const customInputs=(arr,known,label,addLabel)=>{
    const wrap=el('div',{class:'rbac-custom'});
    arr.forEach((val,idx)=>{ if(known.has(val)) return;
      const r=el('div',{class:'list-row'});
      const inp=el('input',{type:'text',value:val,placeholder:label});
      inp.addEventListener('input',e=>{ arr[idx]=e.target.value; ctx.regen(); });
      r.appendChild(inp);
      r.appendChild(el('button',{class:'btn-rm',onclick:()=>{ arr.splice(idx,1); ctx.paint(); }},'×'));
      wrap.appendChild(r);
    });
    wrap.appendChild(el('button',{class:'btn-add',onclick:()=>{ arr.push(''); ctx.paint(); }},
      el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}),addLabel));
    return wrap;
  };

  const toggleVerbEl=()=>{
    box.appendChild(el('div',{class:'rbac-lbl'},'verbs — click to select (multi)'));
    const toggleVerb=v=>{ const i=s.verbs.indexOf(v); if(i>=0)s.verbs.splice(i,1); else s.verbs.push(v); };
    box.appendChild(chips(RBAC_VERBS, v=>s.verbs.indexOf(v)>=0, toggleVerb));
    box.appendChild(el('div',{class:'rbac-hint'},'custom verbs:'));
    box.appendChild(customInputs(s.verbs, new Set(RBAC_VERBS), 'e.g. sign', 'add custom verb'));
  };

  // --- RULE MODE (ClusterRole only): resource rule vs non-resource URL rule ---
  if(s.allowNonResource){
    box.appendChild(el('div',{class:'rbac-lbl'},'rule type'));
    const modes=el('div',{class:'rbac-chips'});
    [['resource','resource rule'],['nonResource','non-resource URL rule']].forEach(([val,lab])=>{
      modes.appendChild(el('button',{class:'rbac-chip'+(s.mode===val?' sel':''),type:'button',
        onclick:e=>{ e.preventDefault(); s.mode=val; ctx.paint(); }}, lab));
    });
    box.appendChild(modes);
    if(s.mode==='nonResource'){
      box.appendChild(el('div',{class:'rbac-hint'},'Grants access to non-API HTTP paths (e.g. /healthz, /metrics, /api/*). Only ClusterRoles can do this — no apiGroups or resources.'));
      box.appendChild(el('div',{class:'rbac-lbl'},'nonResourceURLs'));
      box.appendChild(customInputs(s.nonResourceURLs, new Set(), '/healthz  or  /api/*', 'add URL path'));
      toggleVerbEl();
      return box;
    }
  }

  // --- API GROUP FILTER ---
  box.appendChild(el('div',{class:'rbac-lbl'},'Filter resources by API group'));
  const sel=el('select',{class:'rbac-filter'});
  sel.appendChild(el('option',{value:'__all__'},'(all groups)'));
  RBAC_GROUPS.forEach(g=>{ const o=el('option',{value:g.group},(g.label||g.group)); if(s.groupFilter===g.group)o.selected=true; sel.appendChild(o); });

  box.appendChild(sel);

  // --- RESOURCES ---
  box.appendChild(el('div',{class:'rbac-lbl'},'resources — click to select (multi)'));
  const toggleRes=r=>{ const i=s.resources.indexOf(r); if(i>=0)s.resources.splice(i,1); else s.resources.push(r); };
  if(s.groupFilter==='__all__'){
    RBAC_GROUPS.forEach(g=>{
      box.appendChild(el('div',{class:'rbac-sub'}, rbacGroupLabel(g.group)));
      box.appendChild(chips(g.resources, r=>s.resources.indexOf(r)>=0, toggleRes));
    });
  } else {
    const g=RBAC_GROUPS.find(x=>x.group===s.groupFilter);
    box.appendChild(chips(g?g.resources:[], r=>s.resources.indexOf(r)>=0, toggleRes));
  }
  box.appendChild(el('div',{class:'rbac-hint'},'custom resources (not in the list above):'));
  box.appendChild(customInputs(s.resources, KNOWN_RES, 'e.g. widgets.jahez.io', 'add custom resource'));

  // --- API GROUPS (auto) ---
  box.appendChild(el('div',{class:'rbac-lbl'},'apiGroups — auto-derived from selected resources'));
  const groups=rbacComputeGroups(s.resources.filter(x=>x!==''), s.extraGroups);
  box.appendChild(chips(groups, ()=>true, null, true));
  const spanMsg=groups.filter(x=>x!=='').length + (groups.indexOf('')>=0?1:0);
  if(groups.length>1) box.appendChild(el('div',{class:'rbac-warn'},'⚠ resources span '+groups.length+' API groups — K8s cross-products them. For least-privilege, split into separate rules (one group each).'));
  box.appendChild(el('div',{class:'rbac-hint'},'custom API groups (for custom resources above):'));
  box.appendChild(customInputs(s.extraGroups, new Set(), 'e.g. jahez.io', 'add custom api group'));

  // --- VERBS ---
  box.appendChild(el('div',{class:'rbac-lbl'},'verbs — click to select (multi)'));
  const toggleVerb=v=>{ const i=s.verbs.indexOf(v); if(i>=0)s.verbs.splice(i,1); else s.verbs.push(v); };
  box.appendChild(chips(RBAC_VERBS, v=>s.verbs.indexOf(v)>=0, toggleVerb));
  box.appendChild(el('div',{class:'rbac-hint'},'custom verbs:'));
  box.appendChild(customInputs(s.verbs, new Set(RBAC_VERBS), 'e.g. sign', 'add custom verb'));

  // --- RESOURCE NAMES (optional) ---
  box.appendChild(el('div',{class:'rbac-lbl'},'resourceNames (optional) — restrict to named instances'));
  box.appendChild(customInputs(s.resourceNames, new Set(), 'e.g. jahez-api', 'add resourceName'));
  return box;
}

  callouts:[

    {type:'warn',html:'If a quota constrains <code>requests.*</code> or <code>limits.*</code>, Pods without those fields are <strong>rejected</strong>. Pair a ResourceQuota with a LimitRange so Pods get defaults automatically.'},
    {type:'tip',html:'Check usage vs limit with <code>kubectl describe resourcequota -n jahez-prod</code> \u2014 the Used/Hard columns tell you how close you are. Use <code>scopes</code>/<code>scopeSelector</code> to apply a quota only to a class of Pods (e.g. <code>BestEffort</code>, or a <code>PriorityClass</code>).'},

const navEl=document.getElementById('nav');
let navMode='type';
try{const m=localStorage.getItem('navMode'); if(m==='topic'||m==='type') navMode=m;}catch(_){}
function buildSidebar(){
  navEl.innerHTML='';
  const groups = navMode==='topic' ? TOPICS : GROUPS;
  groups.forEach(g=>{
    const grp=el('div',{class:'nav-group','data-group':g.id});
    const head=el('button',{class:'nav-group-head',onclick:()=>grp.classList.toggle('collapsed')},
      el('span',{class:'gicon',html:g.icon}), g.name,
      g.weight?el('span',{class:'wt'},g.weight):null,
      el('span',{class:'chev',html:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>'}));
    grp.appendChild(head);
    const items=el('div',{class:'nav-items'});
    if(g.note) items.appendChild(el('div',{class:'nav-note'},g.note));
    (g.items||[]).forEach(it=>{
      const btn=el('button',{class:'nav-item','data-id':it.id,'data-label':it.label.toLowerCase(),
        onclick:()=>navigate(it.id)}, it.label,
        it.api?el('span',{class:'kindtag'},it.api):null);
      items.appendChild(btn);
    });
    (g.extras||[]).forEach(ex=>{
      const gid=ex[2];
      if(gid){
        const btn=el('button',{class:'nav-item topic','data-id':'tg:'+gid,'data-label':ex[0].toLowerCase(),
          onclick:()=>navigate('tg:'+gid)}, ex[0], ex[1]?el('span',{class:'kindtag'},ex[1]):null);
        items.appendChild(btn);
      } else {
        items.appendChild(el('div',{class:'nav-item muted','data-label':ex[0].toLowerCase()},
          ex[0], ex[1]?el('span',{class:'kindtag muted'},ex[1]):null));
      }
    });
    grp.appendChild(items);
    navEl.appendChild(grp);
  });
}
function setNavMode(mode){
  navMode=mode;
  try{localStorage.setItem('navMode',mode);}catch(_){}
  document.querySelectorAll('.nav-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  const srch=document.getElementById('navSearch'); if(srch) srch.value='';
  buildSidebar();
  if(_activeId) setActive(_activeId);
}
document.querySelectorAll('.nav-mode-btn').forEach(b=>{
  b.classList.toggle('active', b.dataset.mode===navMode);
  b.addEventListener('click',()=>{ if(b.dataset.mode!==navMode) setNavMode(b.dataset.mode); });
});
let _activeId=null;
function setActive(id){
  _activeId=id;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
}

/* search filter */
document.getElementById('navSearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.nav-group').forEach(grp=>{
    let any=false;
    grp.querySelectorAll('.nav-item').forEach(it=>{
      const show=!q||it.dataset.label.includes(q);
      it.style.display=show?'':'none'; if(show)any=true;
    });
    grp.style.display=any?'':'none';
    if(q)grp.classList.remove('collapsed');
  });
});

const toast=document.getElementById('toast');
let toastT;
function showToast(msg){toast.textContent=msg||'copied to clipboard';toast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),1600);}
function copyText(t,msg){navigator.clipboard.writeText(t).then(()=>showToast(msg)).catch(()=>{
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast(msg);}catch(_){}ta.remove();});}
function download(name,text){const b=new Blob([text],{type:'text/yaml'});const u=URL.createObjectURL(b);
  const a=el('a',{href:u,download:name});document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}

function propCat(resId, fpath){
  const grp=GRP[resId]; if(!grp) return 999;
  const norm=fpath.replace(/\[\]/g,''); const segs=norm.split('.'); const leaf=segs[segs.length-1];
  const metaIdx=grp.findIndex(g=>/Metadata/i.test(g[0]));
  if(segs[0]==='metadata') return metaIdx<0?999:metaIdx;
  const CONTAINER_CAT={roleRef:'Role Reference',subjects:'Subjects',rules:'Rules',scaleTargetRef:'Target',metrics:'Metrics',scopeSelector:'Scopes'};
  for(const sg of segs){ if(CONTAINER_CAT[sg]){ const ci=grp.findIndex(g=>g[0]===CONTAINER_CAT[sg]); if(ci>=0) return ci; } }
  if(LEAF_CAT[leaf]){ const i=grp.findIndex(g=>g[0]===LEAF_CAT[leaf]); if(i>=0) return i; }
  for(let ci=0;ci<grp.length;ci++){ if(ci===metaIdx)continue; for(const tk of grp[ci][1]){ if(leaf===tk.split('.').pop()) return ci; } }
  for(let ci=0;ci<grp.length;ci++){ if(ci===metaIdx)continue; for(const tk of grp[ci][1]){ if(segs.includes(tk.split('.').pop())) return ci; } }
  return 999;
}
function propRank(resId, fpath){

    xs.appendChild(el('p',{class:'prose',html:'A complete manifest with the most commonly used fields filled in \u2014 copy it as a starting point and trim what you don\u2019t need.'}));
    xs.appendChild(codeBlock(res.kind.toLowerCase()+'.yaml', REF[res.id]));
    page.appendChild(xs);
  }

  // commands
  if(res.commands){
    const cs=el('section',{class:'section'});
    cs.appendChild(sectionTitle('kubectl Commands'));
    const list=el('div',{class:'cmd-list'});
    res.commands.forEach(cm=>{
      const c=el('div',{class:'cmd'});
      const line=el('div',{class:'cmd-line'});
      line.appendChild(el('span',{class:'prompt'},'$'));
      line.appendChild(el('code',{},cm.c));
      line.appendChild(el('button',{class:'copy-cmd',onclick:()=>copyText(cm.c,'command copied')},'copy'));
      c.appendChild(line);
      if(cm.d)c.appendChild(el('div',{class:'cmd-desc'},cm.d));
      list.appendChild(c);
    });
    cs.appendChild(list); page.appendChild(cs);
  }

  // generator
  if(res.gen){
    if(res.id==='networkpolicy') page.appendChild(netpolExplainer());
    const gs=el('section',{class:'section'});
    gs.appendChild(sectionTitle('Interactive YAML Generator'));
    gs.appendChild(el('p',{class:'prose',html:'Check the properties you need, fill in the values, and the manifest builds live. Multiple containers, ports, env vars and volumes are all supported — click <strong>add</strong> to repeat a block.'}));
    const gen=el('div',{class:'gen'});
    gen.appendChild(el('div',{class:'gen-head'},
      el('span',{class:'gh-icon',html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13l2 2 4-4"/></svg>'}),
      el('div',{},el('h4',{},'Build a '+res.kind),el('p',{},'kubectl apply -f '+res.kind.toLowerCase()+'.yaml'))));
    const grid=el('div',{class:'gen-grid'});
    const form=el('div',{class:'gen-form'});
    const out=el('div',{class:'gen-out'});
    const fname=res.kind.toLowerCase()+'.yaml';
    out.appendChild(el('div',{class:'gen-out-head'},
      el('span',{class:'traf'},el('i'),el('i'),el('i')),
      el('span',{class:'fname'},fname),
      el('span',{class:'obtns'},
        el('button',{class:'obtn',id:'btnReset'},el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>'}),'reset'),
        el('button',{class:'obtn',id:'btnCopy'},el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'}),'copy'),
        el('button',{class:'obtn',id:'btnDl'},el('span',{html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>'}),'.yaml'))));
    const pre=el('pre',{class:'yaml-out',id:'yamlOut'});
    out.appendChild(pre);
    grid.appendChild(form); grid.appendChild(out); gen.appendChild(grid); gs.appendChild(gen);
    page.appendChild(gs);

    if(!genStates[res.id]) genStates[res.id]=defaultState(res.gen.fields);
    let currentYAML='';
    function generate(){
      let obj=Object.assign({apiVersion:res.apiVersion,kind:res.kind},buildObj(res.gen.fields,genStates[res.id]));
      if(res.gen.transform) obj=res.gen.transform(obj);
      currentYAML=toYAML(obj);
      pre.innerHTML=highlightYAML(currentYAML);
    }
    const _expanded=new Set();
    function paint(){ form.innerHTML=''; form.appendChild(renderFields(res.gen.fields,genStates[res.id],{regen:generate,paint,expanded:_expanded})); generate(); }
    paint();
    setTimeout(()=>{
      document.getElementById('btnCopy').onclick=()=>copyText(currentYAML,'YAML copied');
      document.getElementById('btnDl').onclick=()=>download(fname,currentYAML);
      document.getElementById('btnReset').onclick=()=>{genStates[res.id]=defaultState(res.gen.fields);paint();showToast('reset to defaults');};
    },0);
  }

  content.appendChild(page);
  window.scrollTo(0,0);
}

const C_PLANE='#326ce5', C_PLANE_FILL='#16233c';
const C_NODE='#2dd4bf',  C_NODE_FILL='#10212b';
const C_POD='#5b8ad6',   C_POD_FILL='#15233a';
const C_TXT='#dce6f2',   C_DIM='#8497ad';

function box(x,y,w,h,fill,stroke,key){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" '
    + 'fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>';
}
function lbl(x,y,t,size,fill,weight){
  return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-family="\'IBM Plex Mono\',monospace" '
    + 'font-size="'+(size||13)+'" font-weight="'+(weight||500)+'" fill="'+(fill||C_TXT)+'">'+t+'</text>';
}
function node(key,inner){
  return '<g class="diag-node" data-key="'+key+'">'+inner+'</g>';
}

/* clickable component info, keyed by data-key */
const DIAG_INFO={
  // control plane
  apiserver:{t:'kube-apiserver',d:'The front door to the cluster. Every <code>kubectl</code> command, controller and kubelet talks to the API server over REST. It validates and persists objects to etcd. If it is down, the cluster is effectively read-only.'},
  etcd:{t:'etcd',d:'The cluster\u2019s single source of truth: a consistent, highly-available key-value store holding all object state. Back this up and you can rebuild the control plane.'},
  scheduler:{t:'kube-scheduler',d:'Watches for newly created Pods with no assigned node and picks the best node based on resource requests, affinity, taints/tolerations and constraints. It only decides \u2014 the kubelet does the work.'},
  ctrlmgr:{t:'kube-controller-manager',d:'Runs the control loops: Deployment, ReplicaSet, Node, Job and more. Each loop drives the actual state toward the desired state recorded in etcd.'},
  ccm:{t:'cloud-controller-manager',d:'Bridges Kubernetes with the cloud provider \u2014 provisioning load balancers for Services, attaching volumes, and managing node lifecycle. Absent on bare-metal clusters.'},
  // worker
  kubelet:{t:'kubelet',d:'The node agent. It registers the node, receives PodSpecs from the API server, and ensures the described containers are running and healthy via the container runtime.'},
  kproxy:{t:'kube-proxy',d:'Maintains network rules on each node (iptables/IPVS) so that traffic to a Service ClusterIP is load-balanced across the backing Pods.'},
  runtime:{t:'container runtime',d:'The software that actually runs containers \u2014 containerd or CRI-O. The kubelet drives it through the Container Runtime Interface (CRI).'},
  wpod:{t:'Pods',d:'The smallest deployable unit. One or more containers sharing a network namespace and storage, scheduled together onto a node. This is what your application actually runs inside.'},
  // relationships
  ingress:{t:'Ingress',d:'HTTP/HTTPS routing rules (host + path) into the cluster. Requires an ingress controller. Routes external traffic to a backing Service.'},
  service:{t:'Service',d:'A stable virtual IP and DNS name fronting a set of Pods selected by labels. Decouples clients from the ever-changing Pod IPs.'},
  deployment:{t:'Deployment',d:'Declares the desired state for a stateless app and manages rolling updates. It owns and reconciles a ReplicaSet.'},
  replicaset:{t:'ReplicaSet',d:'Ensures a specified number of identical Pod replicas are running. Normally created and owned by a Deployment, not directly.'},
  pods:{t:'Pods',d:'The running replicas created from the Deployment\u2019s pod template. Ephemeral \u2014 replaced, not repaired, when they fail.'},
  configmap:{t:'ConfigMap',d:'Non-secret key/value configuration injected into Pods as env vars or mounted files. Keeps config out of the image.'},
  secret:{t:'Secret',d:'Like a ConfigMap but for sensitive data (base64-encoded at rest). Mounted as files or env vars; reference, never bake into images.'},
  pvc:{t:'PersistentVolumeClaim',d:'A Pod\u2019s request for storage of a given size/class. Bound to a PersistentVolume and mounted into containers for state that must outlive the Pod.'},
};

  // apiserver hub
  s+=node('apiserver', box(380,64,180,46,C_PLANE_FILL,C_PLANE)+lbl(470,92,'kube-apiserver',13,'#bcd4ff',600));

function renderArchitecture(){
  content.innerHTML='';

  head.appendChild(el('div',{class:'eyebrow'},'Core Concepts'));
  head.appendChild(el('h2',{},'Cluster Architecture'));
  head.appendChild(el('p',{class:'lede'},'How the pieces fit together. Tap any component to see what it does — the same mental model the CKAD assumes you carry into the terminal.'));
  page.appendChild(head);

  const sec=el('section',{class:'section'});

  const boxEl=el('div',{class:'diagram-box'});
  const info=el('div',{class:'diag-info',html:'<strong>Tip</strong> &nbsp;tap a box in the diagram to read what each component does.'});
  const legend=el('div',{class:'diag-legend'});

  function show(d){
    [...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.id===d.id));
    boxEl.innerHTML=d.build();
    legend.innerHTML='';
    d.legend.forEach(l=>{
      legend.appendChild(el('div',{class:'lg'},el('i',{style:'background:'+l[0]}),l[1]));
    });
    info.innerHTML='<strong>Tip</strong> &nbsp;tap a box in the diagram to read what each component does.';
    boxEl.querySelectorAll('.diag-node').forEach(n=>{
      n.addEventListener('click',()=>{
        const k=n.getAttribute('data-key'); const d2=DIAG_INFO[k];
        if(d2) info.innerHTML='<strong>'+d2.t+'</strong><br>'+d2.d;
      });
    });
  }
  DIAGRAMS.forEach(d=>{
    tabs.appendChild(el('button',{class:'dtab','data-id':d.id,onclick:()=>show(d)},d.label));
  });
  sec.appendChild(tabs); sec.appendChild(boxEl); sec.appendChild(legend); sec.appendChild(info);
  page.appendChild(sec);
  content.appendChild(page);
  show(DIAGRAMS[0]);
  window.scrollTo(0,0);
}

images:{domain:'Application Design & Build',title:'Build & Modify Container Images',
  lede:'You must be able to write a Dockerfile and build, tag and push an image with docker or podman.',
  overview:[`<strong>ENTRYPOINT vs CMD:</strong> ENTRYPOINT is the fixed executable, CMD supplies default args you can override at run time. Inside a Pod, the container’s <code>command</code> overrides ENTRYPOINT and <code>args</code> overrides CMD.`,
    `Prefer tiny bases (<code>alpine</code>, <code>distroless</code>) and multi-stage builds so the final image carries only your binary, not the whole toolchain.`],
  commands:[
    ["docker build -t registry.jahez.net/jahez-api:1.4.0 .","Build from the Dockerfile here and tag it."],
    ["podman build -t registry.jahez.net/jahez-api:1.4.0 .","Same, rootless — podman is common on the exam."],
    ["docker tag jahez-api:1.4.0 registry.jahez.net/jahez-api:1.4.0","Retag an existing image for your registry."],
    ["docker push registry.jahez.net/jahez-api:1.4.0","Push so the cluster can pull it."],
    ["docker run --rm -p 8080:8080 registry.jahez.net/jahez-api:1.4.0","Smoke-test locally before deploying."]],
  examples:[{name:'Dockerfile',yaml:`# multi-stage: build, then ship only the binary
FROM golang:1.22 AS build
WORKDIR /src
COPY . .
RUN CGO_ENABLED=0 go build -o /app ./cmd/api

FROM gcr.io/distroless/static
COPY --from=build /app /app
EXPOSE 8080
ENTRYPOINT ["/app"]
CMD ["--port=8080"]`}],
  tasks:[
    {q:`Build the image in the current directory, tag it <code>registry.jahez.net/jahez-api:2.0</code> and push it.`,
     a:`<pre>docker build -t registry.jahez.net/jahez-api:2.0 .
docker push registry.jahez.net/jahez-api:2.0</pre>`},
    {q:`A Pod must run <code>/app --debug</code> instead of the image default. What goes in the container spec?`,
     a:`<pre>command: ["/app"]     # replaces ENTRYPOINT
args: ["--debug"]     # replaces CMD</pre>Set <code>args</code> alone if you keep the image ENTRYPOINT; set <code>command</code> to replace it.`}],
  tips:[`On the exam, check what’s installed first: <code>which docker podman buildah</code>.`]},

multicontainer:{domain:'Application Design & Build',title:'Multi-container Pod Patterns',
  lede:'Containers in one Pod share the network and can share volumes — the basis of init, sidecar, adapter and ambassador patterns.',
  overview:[`<strong>initContainers</strong> run to completion, in order, before the app starts — use for migrations or waiting on a dependency. <strong>Sidecar</strong> (K8s 1.29+) is an initContainer with <code>restartPolicy: Always</code> that keeps running beside the app (log shipper, proxy).`,
    `<strong>Adapter</strong> reshapes the app’s output; <strong>ambassador</strong> proxies outbound connections. All share the Pod via localhost and a common <code>emptyDir</code>.`],
  commands:[
    ["kubectl logs jahez-api -c log-shipper","Logs from a specific container in the Pod."],
    ["kubectl exec -it jahez-api -c app -- sh","Shell into one named container."]],
  examples:[{name:'pod-sidecar.yaml',yaml:`apiVersion: v1
kind: Pod
metadata:
  name: jahez-api
spec:
  initContainers:
    - name: migrate            # classic init: runs then exits
      image: migrate:1.0
      command: ["sh","-c","./migrate.sh"]
    - name: log-shipper        # native sidecar: stays running
      image: fluent-bit:2.2
      restartPolicy: Always
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
  containers:
    - name: app
      image: registry.jahez.net/jahez-api:1.4.0
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
  volumes:
    - name: logs
      emptyDir: {}`}],
  tasks:[
    {q:`Add a sidecar that tails <code>/var/log/app</code> and stays running for the Pod’s whole life. Which field makes it a sidecar, not a normal init container?`,
     a:`Put it under <code>initContainers</code> with <pre>restartPolicy: Always</pre>That turns an init container into a native sidecar (1.29+): it starts before the app, keeps running alongside it, and doesn’t block startup from completing.`}],
  tips:[`Sidecar and app share files only through a volume both mount — usually an <code>emptyDir</code>.`]},

ephemeral:{domain:'Application Design & Build',title:'Ephemeral Volumes (emptyDir)',
  lede:'emptyDir is scratch space created with the Pod and deleted when the Pod is removed — the simplest way for containers to share files.',
  overview:[`An <code>emptyDir</code> starts empty, lives on the node’s disk, and is wiped when the Pod leaves the node. Set <code>medium: Memory</code> to back it with tmpfs (RAM) — fast, but counts against the container’s memory limit.`,
    `Contrast with persistent storage (PVC), which survives Pod restarts and rescheduling.`],
  examples:[{name:'emptydir.yaml',yaml:`spec:
  containers:
    - name: writer
      image: busybox
      command: ["sh","-c","echo hi > /data/msg; sleep 3600"]
      volumeMounts: [{name: scratch, mountPath: /data}]
    - name: reader
      image: busybox
      command: ["sh","-c","cat /data/msg; sleep 3600"]
      volumeMounts: [{name: scratch, mountPath: /data}]
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 256Mi`}],
  tasks:[
    {q:`Two containers in one Pod must share a cache directory that can be lost on restart. What volume type, and where is it declared?`,
     a:`An <code>emptyDir</code> declared once under <code>spec.volumes</code>, then mounted into both containers at the same path via <code>volumeMounts</code>. For a RAM-backed cache add <pre>emptyDir:
  medium: Memory</pre>`}]},

rollout:{domain:'Application Deployment',title:'Rolling Updates & Rollback',
  lede:'Deployments update Pods gradually and keep a history you can roll back to — core, high-frequency exam skill.',
  overview:[`Changing the Pod template (usually the image) triggers a rolling update governed by <code>strategy.rollingUpdate.maxSurge</code> / <code>maxUnavailable</code>. Each change creates a new ReplicaSet; old ones are kept for rollback.`],
  commands:[
    ["kubectl set image deploy/jahez-api app=registry.jahez.net/jahez-api:1.5.0","Trigger a rolling update in one line."],
    ["kubectl rollout status deploy/jahez-api","Watch the rollout finish (or hang)."],
    ["kubectl rollout history deploy/jahez-api","List revisions."],
    ["kubectl rollout history deploy/jahez-api --revision=3","Inspect what changed in a revision."],
    ["kubectl rollout undo deploy/jahez-api","Roll back to the previous revision."],
    ["kubectl rollout undo deploy/jahez-api --to-revision=2","Roll back to a specific revision."],
    ["kubectl annotate deploy/jahez-api kubernetes.io/change-cause='bump to 1.5.0'","Record a change-cause shown in history."]],
  tasks:[
    {q:`Update <code>jahez-api</code> to image <code>:1.5.0</code>, confirm the rollout succeeded, then roll it back.`,
     a:`<pre>kubectl set image deploy/jahez-api app=registry.jahez.net/jahez-api:1.5.0
kubectl rollout status deploy/jahez-api
kubectl rollout undo deploy/jahez-api</pre>`},
    {q:`Make a Deployment update with zero unavailable Pods at any moment. Which strategy values?`,
     a:`<pre>strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1</pre>New Pods come up before old ones are removed.`}]},

strategies:{domain:'Application Deployment',title:'Blue/Green & Canary',
  lede:'Kubernetes has no blue/green primitive — you build these from Deployments, labels and a Service selector.',
  overview:[`<strong>Blue/green:</strong> run two Deployments (<code>version: blue</code> and <code>version: green</code>); the Service selector points at one. Flip by editing the selector — instant cutover, easy rollback.`,
    `<strong>Canary:</strong> one Service selects a shared label (<code>app: jahez-api</code>) across two Deployments; scale the new version to a small replica count so it takes a fraction of traffic, then scale up.`],
  commands:[
    ["kubectl patch svc jahez-api -p '{\"spec\":{\"selector\":{\"app\":\"jahez-api\",\"version\":\"green\"}}}'","Blue→green cutover by switching the selector."],
    ["kubectl scale deploy/jahez-api-canary --replicas=1","Give the canary ~10% of traffic (1 of 10 pods)."]],
  examples:[{name:'canary.yaml',yaml:`# Service selects BOTH deployments by the shared label
apiVersion: v1
kind: Service
metadata: {name: jahez-api}
spec:
  selector:
    app: jahez-api        # matches stable AND canary pods
  ports: [{port: 80, targetPort: 8080}]
---
# stable: 9 replicas, canary: 1 replica  => ~10% canary`}],
  tasks:[
    {q:`You have <code>jahez-api</code> (v1, 9 replicas) and <code>jahez-api-canary</code> (v2). Both carry <code>app: jahez-api</code>. How does traffic split, and how do you promote?`,
     a:`The Service load-balances across all 10 matching Pods, so the canary gets ~10%. Promote by scaling v2 up and v1 down:<pre>kubectl scale deploy/jahez-api-canary --replicas=9
kubectl scale deploy/jahez-api --replicas=0</pre>`}]},

helm:{domain:'Application Deployment',title:'Helm',
  lede:'Helm installs and upgrades packaged apps (charts). CKAD only expects you to use existing charts.',
  overview:[`A <strong>chart</strong> is a package of templated manifests; a <strong>release</strong> is an installed instance. Values override the chart’s defaults.`],
  commands:[
    ["helm repo add bitnami https://charts.bitnami.com/bitnami","Add a chart repository."],
    ["helm repo update","Refresh repo indexes."],
    ["helm search repo postgres","Find a chart."],
    ["helm install jahez-pg bitnami/postgresql -n jahez-prod","Install a chart as a named release."],
    ["helm install jahez-pg bitnami/postgresql --set auth.database=jahez","Override a value at install."],
    ["helm upgrade jahez-pg bitnami/postgresql --set replicaCount=3","Upgrade a release."],
    ["helm list -n jahez-prod","List releases in a namespace."],
    ["helm rollback jahez-pg 1","Roll a release back to revision 1."],
    ["helm uninstall jahez-pg -n jahez-prod","Remove a release."]],
  tasks:[
    {q:`Install the Bitnami postgresql chart as release <code>jahez-pg</code> in <code>jahez-prod</code>, then list it.`,
     a:`<pre>helm repo add bitnami https://charts.bitnami.com/bitnami
helm install jahez-pg bitnami/postgresql -n jahez-prod
helm list -n jahez-prod</pre>`}],
  tips:[`<code>helm template &lt;chart&gt;</code> renders the manifests locally without installing — handy to inspect what a chart does.`]},

kustomize:{domain:'Application Deployment',title:'Kustomize',
  lede:'Kustomize layers environment-specific overlays on a common base — no templating. Built into kubectl via -k.',
  overview:[`A <code>kustomization.yaml</code> lists resources and transformations (name prefixes, labels, patches, image overrides). A <strong>base</strong> holds the shared manifests; <strong>overlays</strong> (dev/prod) patch it.`],
  commands:[
    ["kubectl kustomize ./overlays/prod","Render the final manifests to stdout (no apply)."],
    ["kubectl apply -k ./overlays/prod","Build and apply an overlay."],
    ["kubectl delete -k ./overlays/prod","Delete everything an overlay created."]],
  examples:[{name:'overlays/prod/kustomization.yaml',yaml:`resources:
  - ../../base
namePrefix: prod-
commonLabels:
  env: prod
images:
  - name: registry.jahez.net/jahez-api
    newTag: 1.5.0
replicas:
  - name: jahez-api
    count: 5
patches:
  - path: resources-patch.yaml
    target: {kind: Deployment, name: jahez-api}`}],
  tasks:[
    {q:`Apply the prod overlay but first preview exactly what will be created.`,
     a:`<pre>kubectl kustomize ./overlays/prod   # preview
kubectl apply -k ./overlays/prod    # apply</pre>`}]},

probes:{domain:'Observability & Maintenance',title:'Probes & Health Checks',
  lede:'Three probe types decide when to restart, when to route traffic, and how long to wait for slow starts.',
  overview:[`<strong>liveness</strong> → restarts a deadlocked container. <strong>readiness</strong> → pulls a Pod out of Service endpoints while it fails, without restarting. <strong>startup</strong> → gates liveness/readiness until a slow app has booted.`,
    `Each uses one handler: <code>httpGet</code>, <code>exec</code>, <code>tcpSocket</code> or <code>grpc</code>, plus timing fields (<code>initialDelaySeconds</code>, <code>periodSeconds</code>, <code>failureThreshold</code>…).`],
  commands:[
    ["kubectl describe pod jahez-api","Probe failures and restarts show in the events."],
    ["kubectl get pod jahez-api -o jsonpath='{.status.containerStatuses[0].restartCount}'","How many times liveness has restarted it."]],
  examples:[{name:'probes.yaml',yaml:`livenessProbe:
  httpGet: {path: /healthz, port: 8080}
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet: {path: /ready, port: 8080}
startupProbe:
  httpGet: {path: /healthz, port: 8080}
  failureThreshold: 30
  periodSeconds: 5          # allows up to 150s to start`}],
  tasks:[
    {q:`A Pod is "Running" but getting traffic before it can serve, causing errors. Which probe fixes it and what does it do?`,
     a:`A <strong>readinessProbe</strong>. Until it passes, the Pod is removed from its Service’s endpoints, so no traffic is routed to it — but it is <em>not</em> restarted.`},
    {q:`An app needs up to 2 minutes to start, but you still want a 15s liveness check afterwards. How?`,
     a:`Add a <code>startupProbe</code> with a generous <code>failureThreshold × periodSeconds</code> (e.g. 24 × 5s = 120s). Liveness is suspended until startup succeeds, then runs normally.`}]},

apideprecations:{domain:'Observability & Maintenance',title:'API Deprecations',
  lede:'APIs graduate (v1beta1 → v1) and old versions are removed. Know how to find and fix the right apiVersion.',
  overview:[`When a group/version is removed, manifests using it stop applying. Fix by updating <code>apiVersion</code> to the current served version and adjusting any renamed fields.`],
  commands:[
    ["kubectl api-versions","All group/versions the cluster serves."],
    ["kubectl api-resources","Every resource with its current apiVersion and whether it’s namespaced."],
    ["kubectl explain ingress --recursive | head","Confirm the live schema/fields for a kind."],
    ["kubectl convert -f old.yaml --output-version networking.k8s.io/v1","Convert a manifest to a newer apiVersion (convert plugin)."]],
  tasks:[
    {q:`<code>kubectl apply</code> fails: "no matches for kind Ingress in version extensions/v1beta1". Fix it.`,
     a:`That version was removed. Check the current one and update the manifest:<pre>kubectl api-resources | grep ingress
# -> networking.k8s.io/v1</pre>Change <code>apiVersion: extensions/v1beta1</code> to <code>networking.k8s.io/v1</code> and update the spec (backend/service shape changed in v1).`}]},

monitor:{domain:'Observability & Maintenance',title:'Monitor with CLI Tools',
  lede:'kubectl top shows live CPU/memory; watch flags show state changing in real time.',
  overview:[`<code>kubectl top</code> needs the <strong>metrics-server</strong> installed. It reports actual usage — useful to size requests/limits or find a hog.`],
  commands:[
    ["kubectl top pods -n jahez-prod","CPU/memory per Pod."],
    ["kubectl top pods --sort-by=memory","Find the biggest memory users."],
    ["kubectl top nodes","Per-node resource usage."],
    ["kubectl get pods -w","Watch Pod state changes live."],
    ["kubectl get events -n jahez-prod --sort-by=.lastTimestamp","Recent cluster events, newest last."]],
  tasks:[
    {q:`Find which Pod in <code>jahez-prod</code> is using the most memory.`,
     a:`<pre>kubectl top pods -n jahez-prod --sort-by=memory</pre>(Requires metrics-server; if it errors, that’s why.)`}]},

logs:{domain:'Observability & Maintenance',title:'Container Logs',
  lede:'kubectl logs is your first debugging stop. Know the flags cold — they save minutes on the exam.',
  commands:[
    ["kubectl logs jahez-api","Logs from the (only) container."],
    ["kubectl logs jahez-api -c log-shipper","A specific container in a multi-container Pod."],
    ["kubectl logs jahez-api --previous","Logs from the previous, crashed instance — key for CrashLoopBackOff."],
    ["kubectl logs -f jahez-api","Follow (stream) live."],
    ["kubectl logs jahez-api --since=1h --tail=100","Last hour, last 100 lines."],
    ["kubectl logs -l app=jahez-api --prefix","Aggregate logs across all Pods matching a label."]],
  tasks:[
    {q:`A Pod is in CrashLoopBackOff. How do you see why it died, not just the restarting container?`,
     a:`<pre>kubectl logs jahez-api --previous</pre>That shows the logs of the instance that crashed, which the current restarting container has replaced.`}]},

debug:{domain:'Observability & Maintenance',title:'Debugging in Kubernetes',
  lede:'A repeatable order: describe → events → logs → exec → ephemeral debug container.',
  commands:[
    ["kubectl describe pod jahez-api","Events at the bottom tell you why a Pod won’t schedule or start."],
    ["kubectl get events --sort-by=.lastTimestamp -n jahez-prod","Cluster-wide recent events."],
    ["kubectl exec -it jahez-api -c app -- sh","Shell into a running container."],
    ["kubectl debug -it jahez-api --image=busybox --target=app","Attach an ephemeral debug container sharing the target’s namespaces."],
    ["kubectl run tmp --image=busybox -it --rm --restart=Never -- sh","Throwaway pod for cluster-side network/DNS tests."],
    ["kubectl get pod jahez-api -o yaml | grep -A5 state","See why a container is waiting/terminated."]],
  tasks:[
    {q:`A Pod is stuck in <code>Pending</code>. What’s the one command that usually tells you why?`,
     a:`<pre>kubectl describe pod jahez-api</pre>Read the <strong>Events</strong> — Pending is almost always insufficient resources, an unschedulable nodeSelector/taint, or an unbound PVC.`},
    {q:`The app image has no shell, so <code>kubectl exec</code> fails. How do you still get a shell into its context?`,
     a:`<pre>kubectl debug -it jahez-api --image=busybox --target=app</pre>An ephemeral debug container shares the target container’s process and network namespaces.`}]},

operators:{domain:'Environment, Config & Security',title:'Operators & CRDs',
  lede:'Operators extend Kubernetes: a CRD adds a new kind, a controller acts on it. CKAD expects you to discover and use them.',
  overview:[`A <strong>CustomResourceDefinition</strong> registers a new kind so <code>kubectl get &lt;kind&gt;</code> works. An <strong>operator</strong> is a controller watching those custom objects and reconciling real state (e.g. a Postgres operator that provisions clusters).`],
  commands:[
    ["kubectl get crd","List installed custom resource types."],
    ["kubectl get crd postgresqls.acid.zalan.do -o yaml","Inspect a CRD’s group, versions and schema."],
    ["kubectl explain postgresql.spec","Discover the fields of a custom resource."],
    ["kubectl get postgresql -A","List instances of a custom resource everywhere."],
    ["kubectl api-resources --api-group=acid.zalan.do","Show the kinds an operator added."]],
  tasks:[
    {q:`An operator is installed. How do you discover what custom kinds it added and what fields they take?`,
     a:`<pre>kubectl get crd
kubectl api-resources --api-group=&lt;group&gt;
kubectl explain &lt;kind&gt;.spec --recursive</pre>Then create instances like any built-in resource.`}],
  tips:[`See the <strong>CustomResourceDefinition</strong> resource in this tool to build a CRD’s YAML.`]},

authadmission:{domain:'Environment, Config & Security',title:'AuthN, AuthZ & Admission',
  lede:'A request passes three gates: authentication (who are you), authorization (may you), admission (mutate/validate).',
  overview:[`<strong>Authentication</strong> proves identity (client certs, ServiceAccount tokens, OIDC). <strong>Authorization</strong> is RBAC — Roles/ClusterRoles bound to subjects. <strong>Admission controllers</strong> run last, mutating (defaults, sidecar injection) or validating (policy, quotas) the object before it’s stored.`],
  commands:[
    ["kubectl auth can-i create deployments -n jahez-prod","Check your own permission."],
    ["kubectl auth can-i list secrets --as=system:serviceaccount:jahez-prod:jahez-api-sa","Check another subject’s permission (impersonation)."],
    ["kubectl auth can-i --list -n jahez-prod","Everything you can do in a namespace."],
    ["kubectl create token jahez-api-sa -n jahez-prod","Mint a ServiceAccount token (authentication credential)."]],
  tasks:[
    {q:`Verify whether the ServiceAccount <code>jahez-api-sa</code> can read Secrets in <code>jahez-prod</code>.`,
     a:`<pre>kubectl auth can-i get secrets \\
  --as=system:serviceaccount:jahez-prod:jahez-api-sa -n jahez-prod</pre>Returns <code>yes</code>/<code>no</code>. If no, bind a Role granting <code>get secrets</code> to that SA.`}],
  tips:[`ResourceQuota and LimitRange are enforced by <em>admission controllers</em> — that’s why a Pod without requests is rejected when a quota exists.`]},

securitycontext:{domain:'Environment, Config & Security',title:'SecurityContext & Capabilities',
  lede:'Harden containers: run as non-root, read-only filesystem, drop Linux capabilities, block privilege escalation.',
  overview:[`Pod-level <code>securityContext</code> sets defaults and owns volume ownership (<code>fsGroup</code>); container-level overrides it and adds <code>readOnlyRootFilesystem</code>, <code>allowPrivilegeEscalation</code>, <code>capabilities</code>. Least privilege: drop <code>ALL</code>, add back only what’s needed.`],
  examples:[{name:'securitycontext.yaml',yaml:`securityContext:          # pod-level
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
containers:
  - name: app
    image: registry.jahez.net/jahez-api:1.4.0
    securityContext:        # container-level
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]`}],
  tasks:[
    {q:`Make a container run as non-root UID 1000 with a read-only root filesystem, allowed only to bind low ports.`,
     a:`<pre>securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]</pre>Mount an <code>emptyDir</code> for any path the app must write.`}],
  tips:[`Build the full YAML in the <strong>Pod</strong> generator’s container → Security section.`]},

requests:{domain:'Environment, Config & Security',title:'Requests & Limits (QoS)',
  lede:'Requests reserve capacity and drive scheduling; limits cap usage. Together they set the Pod’s QoS class.',
  overview:[`<strong>requests</strong> = guaranteed floor the scheduler reserves. <strong>limits</strong> = hard ceiling (memory over limit → OOMKill; CPU over limit → throttled). <strong>QoS:</strong> requests==limits on all resources → <em>Guaranteed</em>; some set → <em>Burstable</em>; none → <em>BestEffort</em> (first evicted).`],
  commands:[
    ["kubectl describe pod jahez-api | grep -A4 Limits","See the effective requests/limits."],
    ["kubectl get pod jahez-api -o jsonpath='{.status.qosClass}'","Show the Pod’s QoS class."]],
  examples:[{name:'resources.yaml',yaml:`resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"`}],
  tasks:[
    {q:`Which QoS class is a Pod whose container sets <code>requests == limits</code> for both cpu and memory, and why does it matter?`,
     a:`<strong>Guaranteed</strong> — the highest class, last to be evicted under node pressure. Setting only requests (not limits) would be <em>Burstable</em>; setting neither is <em>BestEffort</em> and evicted first.`}]},

svcaccess:{domain:'Services & Networking',title:'Troubleshoot Service Access',
  lede:'When a Service "doesn’t work", 90% of the time it’s a selector/label mismatch producing empty endpoints.',
  overview:[`A Service finds Pods by label selector and lists their IPs as <strong>Endpoints</strong>. No matching Pods → no endpoints → connection refused/timeout. Check endpoints first, then port mapping, then DNS.`],
  commands:[
    ["kubectl get endpoints jahez-api","Empty = selector matches no ready Pods (the #1 cause)."],
    ["kubectl get pods -l app=jahez-api --show-labels","Do Pod labels actually match the Service selector?"],
    ["kubectl describe svc jahez-api","Confirm selector, port and targetPort."],
    ["kubectl run tmp --image=busybox -it --rm --restart=Never -- wget -qO- jahez-api:80","Test in-cluster reachability + DNS."],
    ["kubectl port-forward svc/jahez-api 8080:80","Reach the Service from your machine to isolate in/out-cluster issues."]],
  tasks:[
    {q:`<code>curl jahez-api</code> from another Pod times out. First command, and what each outcome means?`,
     a:`<pre>kubectl get endpoints jahez-api</pre>If <strong>empty</strong>: the Service selector doesn’t match any ready Pod — fix labels or the readiness probe. If <strong>populated</strong>: check <code>targetPort</code> vs the container’s real port, then DNS/NetworkPolicy.`}],
  tips:[`Readiness matters: a Pod that fails its readinessProbe is removed from endpoints, so a label match alone isn’t enough.`]},
};

function renderTopic(id){

      const tog=el('button',{class:'task-toggle',onclick:()=>{ const openq=sol.style.display!=='none'; sol.style.display=openq?'none':''; tog.textContent=openq?'Show answer':'Hide answer'; }},'Show answer');
      card.appendChild(tog); card.appendChild(sol); s.appendChild(card); });
    page.appendChild(s); }

    g.tips.forEach(tp=>s.appendChild(el('div',{class:'callout tip'},

      el('p',{html:tp})))); page.appendChild(s); }
  content.appendChild(page);
  window.scrollTo(0,0);
}

  dom.appendChild(el('p',{class:'prose',html:'Source: <a href="https://www.cncf.io/certification/ckad/" target="_blank" rel="noopener" style="color:var(--accent)">CNCF — CKAD</a> (Linux Foundation curriculum). Weights sum to 100%.'}));
  page.appendChild(dom);
  page.appendChild(curriculumShots());

  // setup callouts
  const setup=el('section',{class:'section'});
  setup.appendChild(sectionTitle('Before You Touch a Task'));
  [['tip','Set your shell up first','Run these once at the start of the exam to make everything faster.'],
   ['warn','Always set the namespace','Most tasks specify a namespace. Use <code>-n</code> on every command or set the context default — wrong-namespace answers score zero.'],
   ['info','Bookmarks are allowed','You may use the official kubernetes.io docs during the exam. Practise navigating them quickly; do not rely on them for syntax you should know cold.']
  ].forEach(c=>{
    const ic=c[0]==='warn'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'
      : c[0]==='tip'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    setup.appendChild(el('div',{class:'callout '+c[0]},el('span',{class:'ci',html:ic}),el('p',{html:'<strong>'+c[1]+'</strong><br>'+c[2]})));
  });
  page.appendChild(setup);

  function cmdSection(title,intro,cmds){
    const cs=el('section',{class:'section'});
    cs.appendChild(sectionTitle(title));
    if(intro)cs.appendChild(el('p',{class:'prose',html:intro}));
    const list=el('div',{class:'cmd-list'});
    cmds.forEach(cm=>{
      const c=el('div',{class:'cmd'});
      const line=el('div',{class:'cmd-line'});
      line.appendChild(el('span',{class:'prompt'},'$'));
      line.appendChild(el('code',{},cm[0]));
      line.appendChild(el('button',{class:'copy-cmd',onclick:()=>copyText(cm[0],'command copied')},'copy'));
      c.appendChild(line);
      if(cm[1])c.appendChild(el('div',{class:'cmd-desc',html:cm[1]}));
      list.appendChild(c);
    });
    cs.appendChild(list);
    page.appendChild(cs);
  }

  cmdSection('Shell Setup','Paste at the start. The alias is the single biggest time-saver on the exam.',[
    ["alias k=kubectl",'Type <code>k</code> instead of <code>kubectl</code> everywhere.'],
    ["export do='--dry-run=client -o yaml'",'Now <code>k run ... $do</code> prints a manifest instead of creating the object.'],
    ["export ns='-n jahez-prod'",'Reuse a namespace flag you will type a hundred times.'],
    ["source <(kubectl completion bash)",'Tab-completion for resources and flags.']
  ]);

  cmdSection('Generate, Don\u2019t Type','The golden pattern: let kubectl write the YAML, then edit. Faster and error-free.',[
    ["k run jahez-api --image=registry.jahez.net/api:1.0 $do > pod.yaml",'Scaffold a Pod manifest you can tweak.'],
    ["k create deploy jahez-api --image=registry.jahez.net/api:1.0 --replicas=3 $do > deploy.yaml",'Scaffold a Deployment.'],
    ["k create job backfill --image=busybox $do -- /bin/sh -c 'echo hi'",'Scaffold a Job with a command.'],
    ["k create cj report --image=busybox --schedule='*/5 * * * *' $do -- date",'Scaffold a CronJob.'],
    ["k create cm app-config --from-literal=TZ=Asia/Riyadh $do",'Scaffold a ConfigMap from literals.'],
    ["k create secret generic db --from-literal=password=s3cr3t $do",'Scaffold a Secret.'],
    ["k expose deploy jahez-api --port=80 --target-port=8080 $do",'Generate a Service for an existing Deployment.']
  ]);

  cmdSection('Inspect Fast',null,[
    ["k get pods -A -o wide",'All pods, all namespaces, with node + IP.'],
    ["k describe pod jahez-api","Events at the bottom are where you find why a pod won\u2019t start."],
    ["k logs jahez-api -c sidecar --previous","Logs from a named container, including the crashed instance."],
    ["k get pod jahez-api -o jsonpath='{.spec.containers[*].image}'","Pull one field without scrolling YAML."],
    ["k explain deployment.spec.strategy --recursive","Field reference straight from the API server — no internet needed."]
  ]);

  cmdSection('Edit, Scale, Debug',null,[
    ["k edit deploy jahez-api","Live-edit an object; saves apply on close."],
    ["k scale deploy jahez-api --replicas=5","Scale without editing YAML."],
    ["k set image deploy/jahez-api api=registry.jahez.net/api:1.1","Trigger a rolling update in one line."],
    ["k rollout undo deploy/jahez-api","Roll back the last bad deploy."],
    ["k run tmp --image=busybox -it --rm --restart=Never -- sh","Throwaway debug pod with an interactive shell."],
    ["k delete pod jahez-api --grace-period=0 --force","Force-delete a stuck pod when time is short."]
  ]);

  const out=el('section',{class:'section'});
  out.appendChild(el('div',{class:'callout tip'},
    el('span',{class:'ci',html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>'}),
    el('p',{html:'<strong>Flag every uncertain task and move on.</strong> Easy marks are spread across all 16 questions — never sink 20 minutes into one. Come back if time allows.'})));
  page.appendChild(out);

  content.appendChild(page);
  window.scrollTo(0,0);
}

/* ============================================================
   ROUTER
   ============================================================ */
const SPECIAL={
  home:{group:'Getting Started',label:'Dashboard',render:renderHome},
  architecture:{group:'Getting Started',label:'Cluster Architecture',render:renderArchitecture},
  exam:{group:'Getting Started',label:'CKAD Exam Guide',render:renderExam},
};
function setBreadcrumb(group,leaf){
  const bc=document.getElementById('breadcrumb');
  bc.innerHTML='';
  bc.appendChild(el('span',{},group));
  bc.appendChild(el('span',{class:'sep'},'/'));
  bc.appendChild(el('span',{class:'cur'},leaf));
}
function groupOf(id){
  const g=GROUPS.find(gr=>gr.items.some(it=>it.id===id));
  return g?g.name:'';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
function navigate(id){
  if(id && id.indexOf('tg:')===0){
    const gid=id.slice(3), g=TGUIDES[gid];
    if(g){ renderTopic(gid); setBreadcrumb(g.domain,g.title); setActive(id); closeSidebar(); }
    return;
  }
  if(SPECIAL[id]){
    SPECIAL[id].render();
    setBreadcrumb(SPECIAL[id].group,SPECIAL[id].label);
  } else if(RES[id]){
    renderResource(RES[id]);
    setBreadcrumb(groupOf(id),RES[id].kind);
  } else { return; }
  setActive(id);
  closeSidebar();
}

/* ============================================================
   MOBILE NAV
   ============================================================ */
document.getElementById('hamburger').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
});
document.getElementById('backdrop').addEventListener('click',closeSidebar);

/* ============================================================
   INIT
   ============================================================ */
buildSidebar();
navigate('home');

</script>
